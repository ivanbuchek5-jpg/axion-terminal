<!-- Chart Controls -->
<div class="flex items-center gap-2 px-4 py-2 border-b border-brd bg-sf shrink-0 overflow-x-auto">
  <div class="relative">
    <input id="chartSymbolInput" value="BTC/USDT" autocomplete="off"
      class="bg-sf-ctr border border-brd text-tx font-mono text-sm px-2 py-1 outline-none w-32 focus:border-pri-c"
      placeholder="BTC/USDT"/>
  </div>
  <div class="flex gap-1">
    <button class="tf-btn" onclick="setTF('1')">1m</button>
    <button class="tf-btn" onclick="setTF('5')">5m</button>
    <button class="tf-btn" onclick="setTF('15')">15m</button>
    <button class="tf-btn active" onclick="setTF('60')" id="tf-60">1H</button>
    <button class="tf-btn" onclick="setTF('240')">4H</button>
    <button class="tf-btn" onclick="setTF('D')">1D</button>
    <button class="tf-btn" onclick="setTF('W')">1W</button>
  </div>
  <select id="exchangeSelect" onchange="updateChart()" class="bg-sf-ctr border border-brd text-tx2 font-mono text-xs px-2 py-1 outline-none">
    <option>Binance</option><option>Bybit</option><option>OKX</option>
  </select>
  <div class="hidden md:flex items-center gap-1 ml-auto text-xs text-tx2 font-mono">
    <span class="material-symbols-outlined" style="font-size:14px">info</span>
    Chart powered by TradingView
  </div>
</div>

<!-- TradingView Chart -->
<main class="flex-1 overflow-hidden pb-16 md:pb-0">
  <div id="tv-chart" class="w-full h-full"></div>
</main>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
let widget;
let currentTF='60';
function createChart(){
  const raw = document.getElementById('chartSymbolInput').value.toUpperCase().replace('/','').replace('USDT','');
  const sym = 'BINANCE:' + raw + 'USDT';
  document.getElementById('tv-chart').innerHTML='';
  widget=new TradingView.widget({
    autosize:true,
    symbol:sym,
    interval:currentTF,
    timezone:"Etc/UTC",
    theme:"dark",
    style:"1",
    locale:"en",
    toolbar_bg:"#111319",
    enable_publishing:false,
    hide_top_toolbar:true,
    hide_legend:false,
    save_image:false,
    container_id:"tv-chart",
    backgroundColor:"#111319",
    gridColor:"#1d1f26",
    studies:["MASimple@tv-basicstudies"],
  });
}
function updateChart(){createChart()}
function setTF(tf){
  currentTF=tf;
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('tf-'+tf);if(btn)btn.classList.add('active');
  createChart();
// Autocomplete для вибору символу
if (typeof initAutocomplete !== 'undefined') {
  const chartInput = document.getElementById('chartSymbolInput');
  if (chartInput) initAutocomplete(chartInput, (symbol, base) => {
    chartInput.value = base + '/USDT';
    createChart();
  });
}
}
createChart();
</script>
