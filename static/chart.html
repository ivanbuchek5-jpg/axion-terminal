<!DOCTYPE html>
<html lang="en" data-theme="dark"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0f110d"/>
<title>AXION TERMINAL — Chart</title>
<link rel="icon" type="image/png" href="logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script>try{var t=localStorage.getItem('axion-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="axion.css"/>
</head>
<body>
<div class="shell">
<main>
  <section class="card rise" style="--d:2">
    <div class="row-f" style="gap:12px">
      <div style="width:170px"><input class="field" id="chartSymbolInput" value="BTC/USDT" autocomplete="off" spellcheck="false" aria-label="Token"/></div>
      <select class="select" id="exchangeSelect" aria-label="Exchange">
        <option value="BINANCE">Binance</option><option value="BYBIT">Bybit</option><option value="MEXC">MEXC</option><option value="GATEIO">Gate.io</option><option value="OKX">OKX</option>
      </select>
      <span class="sp"></span>
      <span class="cap" style="display:flex;align-items:center;gap:6px">Powered by TradingView</span>
    </div>
    <div class="tf-wrap" style="margin-top:14px">
      <div class="seg" id="tfSeg" style="min-width:340px">
        <button data-v="1">1m</button><button data-v="5">5m</button><button data-v="15">15m</button><button data-v="60" class="on">1H</button><button data-v="240">4H</button><button data-v="D">1D</button><button data-v="W">1W</button>
      </div>
    </div>
  </section>

  <section class="card chart-card rise" style="--d:3;height:max(460px,calc(100dvh - 330px))">
    <div id="tv-chart"></div>
  </section>
</main>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script src="autocomplete.js"></script>
<script src="shared.js"></script>
<script>
(function(){
  AX.init("chart");
  var inp = document.getElementById("chartSymbolInput"), exSel = document.getElementById("exchangeSelect"), tf = "60";
  var qs = new URLSearchParams(location.search).get("symbol");
  if (qs) inp.value = AX.base(qs) + "/USDT";
  function create(){
    var el = document.getElementById("tv-chart");
    el.innerHTML = "";
    if (!window.TradingView){ el.innerHTML = AX.empty("alert", "TradingView failed to load"); return; }
    var c = AX.tvColors();
    new TradingView.widget({
      autosize: true, symbol: exSel.value + ":" + AX.base(inp.value) + "USDT", interval: tf,
      timezone: "Etc/UTC", theme: c.theme, style: "1", locale: "en",
      toolbar_bg: c.bg, backgroundColor: c.bg, gridColor: c.grid,
      enable_publishing: false, hide_top_toolbar: true, hide_legend: false, save_image: false,
      container_id: "tv-chart", studies: ["MASimple@tv-basicstudies"]
    });
  }
  AX.seg(document.getElementById("tfSeg"), function(v){ tf = v; create(); });
  exSel.addEventListener("change", create);
  initAutocomplete(inp, function(s, base){ inp.value = base + "/USDT"; create(); });
  inp.addEventListener("focus", function(){ inp.select(); });
  window.addEventListener("axion:theme", create);
  create();
})();
</script>
</body></html>
