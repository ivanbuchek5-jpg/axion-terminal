<!DOCTYPE html>
<html lang="en" data-theme="dark"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#25272D"/>
<title>AXION TERMINAL — Pair</title>
<link rel="icon" type="image/png" href="logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/><noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet"/></noscript>
<script>(function(){var t=null;try{t=localStorage.getItem('axion-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='light'?'#E9EAEC':'#25272D')})()</script>
<script>(function(){var d=document.documentElement;try{var t=+sessionStorage.getItem('axion-pt');sessionStorage.removeItem('axion-pt');if(t&&Date.now()-t<10000&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){d.classList.add('pt-in');setTimeout(function(){d.classList.remove('pt-in')},4500)}}catch(e){}})()</script>

<body>
<div id="pt" aria-hidden="true"><div class="pt-glow"></div><div class="pt-core"><div class="pt-logo"></div><div class="pt-word">AXION <b>TERMINAL</b></div></div><div class="pt-bar"><i></i></div></div>
<div class="shell">
<main>
  <section class="card rise ph" style="--d:2">
    <div class="row-f ph-t">
      <a class="icon-btn" href="spread.html" aria-label="Back" id="back"></a>
      <span class="sym"><span class="ico" id="pIco">—</span><span><b><span id="pSym">—</span><span id="pPre"></span></b><small id="pSub">—</small></span></span>
      <div class="psearch"><label class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="pq" placeholder="Search token to build a pair (RT1/RT)…" autocomplete="off" spellcheck="false" aria-label="Search token"></label></div>
      <span class="sp"></span>
      <span class="live" id="live"><i></i>LOADING</span>
      <span class="cdn" id="lat" hidden>—</span>
    </div>
    <div class="big-sp">
      <div><div class="k">Fund</div><div class="v" id="vFund">—</div></div>
      <div><div class="k">Entry</div><div class="v" id="vEntry">—</div></div>
      <div><div class="k">Exit</div><div class="v" id="vExit">—</div></div>
    </div>
  </section>

  <section class="pgrid rise" style="--d:3">
    <div class="exg" id="exs"></div>
    <div class="card c-chart" style="min-width:0">
      <div class="ctl">
        <div class="seg" id="ivSeg"><button data-v="1000" class="on">1s</button><button data-v="2000">2s</button><button data-v="5000">5s</button></div>
        <div class="seg" id="rgSeg"><button data-v="60">1h</button><button data-v="360">6h</button><button data-v="1440" class="on">24h</button></div>
        <div class="legend"><span><i style="background:var(--accent-text)"></i>Entry (open)</span><span><i style="background:var(--neg)"></i>Exit (close)</span></div>
        <span class="sp"></span>
        <button class="btn sm" id="bFit" type="button">Fit</button>
        <button class="btn sm" id="bClr" type="button">Clear</button>
      </div>
      <div class="chart-w"><div id="sp-chart"></div><div class="tip" id="sp-tip"></div></div>
      <div class="mu" id="hNote" style="padding:8px 16px 12px;font:500 .6875rem var(--mono)"></div>
    </div>

    <div style="display:grid;gap:14px;align-content:start;min-width:0">
      <div class="card c-calc">
        <div class="card-h" style="padding:0 0 12px"><span class="t">Spread calculator</span><span class="chip sm" id="cMode">simulation</span></div>
        <div class="calc">
          <div>
            <div class="cap"><span>Entry prices · <span id="cAuto">live</span></span><button class="lnk" id="cLive" type="button" hidden>Use live prices</button></div>
            <div class="px2" style="margin-top:8px">
              <label class="pf"><span id="cLbL"></span><input class="field" id="cPL" inputmode="decimal" autocomplete="off" placeholder="Price" aria-label="Long price"></label>
              <label class="pf"><span id="cLbS"></span><input class="field" id="cPS" inputmode="decimal" autocomplete="off" placeholder="Price" aria-label="Short price"></label>
            </div>
          </div>
          <div>
            <div class="cap"><span>Size</span></div>
            <div class="row2" style="margin-top:8px">
              <input class="field" id="cAmt" inputmode="decimal" autocomplete="off" placeholder="Amount" value="1000" aria-label="Amount">
              <div class="seg" id="cUnit"><button data-v="usd" class="on">USD</button><button data-v="coin">Coins</button></div>
            </div>
          </div>
          <div class="pos-sum">
            <div><div class="k">Spread</div><div class="v" id="cEntry">—</div></div>
            <div><div class="k">PnL</div><div class="v" id="cPnl">—</div></div>
            <div><div class="k">Closed PnL</div><div class="v" id="cExit">—</div></div>
          </div>
          <div class="kv" id="cKv"></div>
          <div class="mu" id="cWarn" style="font:500 .75rem var(--sans);min-height:1em"></div>
          <div class="row-f" id="cBtnsA"><button class="btn primary" id="cOpen" type="button" style="flex:1">Open position</button></div>
          <div class="btns3" id="cBtnsB" hidden><a class="btn" href="spread.html" id="cBack">Back</a><button class="btn ghost-g" id="cAdd" type="button">Increase</button><button class="btn ghost-r" id="cClose" type="button">Close position</button></div>
        </div>
      </div>
      <div class="card flush c-bk">
        <div class="card-h"><span class="t">Order books</span></div>
        <div class="bks"><div class="bkc"><div class="bkh"><b id="bkT0">—</b><span id="bkS0">—</span></div><div class="bk" id="bk0"></div></div><div class="bkc"><div class="bkh"><b id="bkT1">—</b><span id="bkS1">—</span></div><div class="bk" id="bk1"></div></div></div>
      </div>
    </div>
  </section>

</main>
</div>

<script src="lwc.js?v=22"></script>
<script src="autocomplete.js?v=22"></script>
<script src="shared.js?v=22"></script>
<script>
(function(){
  AX.init("spread", { ticker: false });
  document.getElementById("back").innerHTML = AX.icon("back");
  var P = new URLSearchParams(location.search);
  var sym = AX.base(P.get("symbol") || "BTC");
  /* a leg is "exchange:type:TICKER" — the two legs may trade different tickers of the same token (RT1/RT) */
  function full(s, d){ var p = String(s || "").split(":"); return p[0] + ":" + p[1] + ":" + AX.base(p[2] || d); }
  var LG = full(P.get("long") || "binance:fut", sym), SH = full(P.get("short") || "okx:fut", sym);
  var KEY = "", lg = [], sh = [];

  var D = null, ms = 1000, timer = 0, stopped = false;
  function $(id){ return document.getElementById(id); }
  function sgn(v, d){ return (v > 0 ? "+" : "") + v.toFixed(d == null ? 3 : d) + "%"; }
  function cls(v){ return v > 0 ? "up" : v < 0 ? "dn" : ""; }
  function usd(v){ var a = Math.abs(v); return (v < 0 ? "-$" : "$") + (a >= 100 ? AX.num(a, 0) : a >= 1 ? a.toFixed(2) : a.toFixed(4)); }
  function tops(d){
    var L = d.long, S = d.short;
    if (!L.asks.length || !L.bids.length || !S.asks.length || !S.bids.length) return null;
    return { aL: L.asks[0][0], bL: L.bids[0][0], aS: S.asks[0][0], bS: S.bids[0][0] };
  }
  /* walk the book: qty in coins → {avg, got} */
  function walk(lv, qty){
    var need = qty, cost = 0, got = 0;
    for (var i = 0; i < lv.length && need > 1e-12; i++){ var t = Math.min(need, lv[i][1]); cost += t * lv[i][0]; got += t; need -= t; }
    return { avg: got ? cost / got : 0, got: got };
  }

  /* ── chart ── */
  var chart = null, sE = null, sX = null, hist = { e: [], x: [] }, pxMap = {};
  function cc(){
    var l = AX.theme() === "light";
    return { txt: l ? "#6A6E78" : "#9A9DA6", grid: l ? "rgba(14,15,17,.055)" : "rgba(255,255,255,.04)", up: l ? "#00A63E" : "#00FF48", dn: l ? "#D6342C" : "#FF5A52", bg: "transparent" };
  }
  function initChart(){
    if (!window.LightweightCharts){ $("sp-chart").innerHTML = AX.empty("alert", "Chart library failed to load"); return; }
    var c = cc();
    chart = LightweightCharts.createChart($("sp-chart"), {
      autoSize: true,
      layout: { background: { type: "solid", color: c.bg }, textColor: c.txt, fontFamily: "JetBrains Mono, monospace", fontSize: 11 },
      grid: { vertLines: { color: c.grid }, horzLines: { color: c.grid } },
      rightPriceScale: { borderVisible: false, scaleMargins: { top: .12, bottom: .12 } },
      timeScale: { timeVisible: true, secondsVisible: true, borderVisible: false, rightOffset: 4 },
      crosshair: { mode: 0 },
      localization: { priceFormatter: function(v){ return v.toFixed(3) + "%"; } }
    });
    var o = { lineWidth: 2, priceLineVisible: true, lastValueVisible: true, priceFormat: { type: "custom", formatter: function(v){ return v.toFixed(3) + "%"; }, minMove: .0001 } };
    sE = chart.addLineSeries(Object.assign({ color: c.up }, o));
    sX = chart.addLineSeries(Object.assign({ color: c.dn }, o));
    chart.timeScale().fitContent();
    var tip = $("sp-tip"), wrap = $("sp-chart");
    chart.subscribeCrosshairMove(function(p){
      if (!p.time || !p.point || p.point.x < 0 || p.point.y < 0){ tip.classList.remove("on"); return; }
      var e = p.seriesData.get(sE), x = p.seriesData.get(sX);
      if (!e || !x){ tip.classList.remove("on"); return; }
      var px = pxMap[p.time] || {}, dt = new Date(p.time * 1000), z = function(n){ return (n < 10 ? "0" : "") + n; };
      var col = function(v){ return v >= 0 ? "var(--accent-text)" : "var(--neg)"; };
      tip.innerHTML = '<div class="d">' + z(dt.getDate()) + "." + z(dt.getMonth() + 1) + ", " + z(dt.getHours()) + ":" + z(dt.getMinutes()) + ":" + z(dt.getSeconds()) + "</div>" +
        '<div class="r"><i class="dt" style="background:var(--accent-text)"></i><span class="k">In %</span><span class="v" style="color:' + col(e.value) + '">' + sgn(e.value) + "</span></div>" +
        '<div class="r"><i class="dt" style="background:var(--neg)"></i><span class="k">Out %</span><span class="v" style="color:' + col(x.value) + '">' + sgn(x.value) + "</span></div>" +
        (px.l ? '<div class="r">' + AX.xt(lg[0]) + '<span class="k">' + AX.esc(AX.exName(lg[0])) + '</span><span class="v">' + AX.plain(px.l) + "</span></div>" +
        '<div class="r">' + AX.xt(sh[0]) + '<span class="k">' + AX.esc(AX.exName(sh[0])) + '</span><span class="v">' + AX.plain(px.s) + "</span></div>" : "");
      var w = tip.offsetWidth, h = tip.offsetHeight, W = wrap.clientWidth, H = wrap.clientHeight;
      var left = p.point.x + 18; if (left + w > W - 60) left = p.point.x - w - 18;
      var top = Math.min(Math.max(8, p.point.y - h / 2), H - h - 8);
      tip.style.left = Math.max(4, left) + "px"; tip.style.top = top + "px"; tip.classList.add("on");
    });
  }
  function recolor(){
    if (!chart) return; var c = cc();
    chart.applyOptions({ layout: { textColor: c.txt }, grid: { vertLines: { color: c.grid }, horzLines: { color: c.grid } } });
    sE.applyOptions({ color: c.up }); sX.applyOptions({ color: c.dn });
  }
  window.addEventListener("axion:theme", recolor);
  var lastSave = 0;
  function pushPoint(en, ex, pl, ps){
    if (!chart) return;
    var t = Math.floor(Date.now() / 1000);
    pxMap[t] = { l: pl, s: ps };
    var a = hist.e[hist.e.length - 1];
    if (a && a.time > t) return;
    if (a && a.time === t){ a.value = en; hist.x[hist.x.length - 1].value = ex; }
    else { hist.e.push({ time: t, value: en }); hist.x.push({ time: t, value: ex }); if (hist.e.length > 12000){ hist.e.shift(); hist.x.shift(); } }
    sE.update({ time: t, value: en }); sX.update({ time: t, value: ex });
  }
  AX.seg($("ivSeg"), function(v){ ms = +v; });
  /* previous 24h: 1-minute closes of both legs from the exchanges → the "tear and re-join" history */
  var rg = 1440, histOk = false;
  function applyRange(){
    if (!chart || !hist.e.length) return;
    var last = hist.e[hist.e.length - 1].time;
    try { chart.timeScale().setVisibleRange({ from: last - rg * 60, to: last + 60 }); } catch (e) {}
  }
  AX.seg($("rgSeg"), function(v){ rg = +v; applyRange(); });
  function loadHist(){
    var kk = KEY;
    fetch("/api/hist?symbol=" + encodeURIComponent(lg[2]) + "&long=" + encodeURIComponent(LG) + "&short=" + encodeURIComponent(SH) + "&minutes=1440", { cache: "no-store" })
      .then(function(r){ return r.json(); }).then(function(j){
        if (kk !== KEY) return;
        if (!j || !j.t || !j.t.length){ $("hNote").textContent = "No history from the exchanges for this pair — chart fills live."; return; }
        var live = hist; // points collected while history was loading
        var e = [], x = [], first = live.e.length ? live.e[0].time : Infinity;
        for (var i = 0; i < j.t.length; i++){ if (j.t[i] >= first) break; pxMap[j.t[i]] = { l: j.l[i], s: j.s[i] }; e.push({ time: j.t[i], value: j["in"][i] }); x.push({ time: j.t[i], value: j.out[i] }); }
        hist = { e: e.concat(live.e), x: x.concat(live.x) };
        sE.setData(hist.e); sX.setData(hist.x); histOk = true;
        $("hNote").textContent = "History: 1-min candles · " + j.n + " points";
        applyRange();
      }).catch(function(){ $("hNote").textContent = "History unavailable — chart fills live."; });
  }
  $("bFit").addEventListener("click", function(){ if (chart) chart.timeScale().fitContent(); });
  $("bClr").addEventListener("click", function(){ hist = { e: [], x: [] }; pxMap = {}; if (sE){ sE.setData([]); sX.setData([]); } loadHist(); });

  /* ── header + table + exchange cards ── */
  function renderHead(d){
    var t = tops(d); if (!t) return;
    var en = (t.bS - t.aL) / t.aL * 100, ex = (t.bL - t.aS) / t.aS * 100;
    setT("vEntry", sgn(en), "v " + cls(en)); setT("vExit", sgn(ex), "v " + cls(ex));
    var fr = function(l){ return l.type === "fut" ? l.rate : 0; };
    var fn = fr(d.short) - fr(d.long);   /* actual funding the pair collects at the next payouts */
    setT("vFund", sgn(fn), "v " + cls(fn));
    pushPoint(en, ex, (t.aL + t.bL) / 2, (t.aS + t.bS) / 2);
    if (!built){ buildHead(d); built = true; }
    var pre = d.pre ? 1 : 0; if (pre !== prePaint){ prePaint = pre; $("pPre").innerHTML = AX.pre(pre); }
    [d.long, d.short].forEach(function(l, i){
      var bid = l.bids[0] ? l.bids[0][0] : 0, ask = l.asks[0] ? l.asks[0][0] : 0, mid = (bid + ask) / 2;
      var bs = mid ? (ask - bid) / mid * 100 : 0, fut = l.type === "fut";
      setT("e" + i + "a", AX.plain(ask)); setT("e" + i + "b", AX.plain(bid));
      setT("e" + i + "v", AX.vol(l.vol24h), AX.volc(l.vol24h)); setT("e" + i + "m", l.maxpos ? AX.vol(l.maxpos) : "—"); setT("e" + i + "s", bs.toFixed(3) + "%");
      if (fut){
        setT("e" + i + "f", sgn(l.rate, 4), l.rate > 0 ? "dn" : l.rate < 0 ? "up" : ""); setT("e" + i + "i", l.hours + "h");
        var el = $("e" + i + "n"), v = String(l.next || ""); if (el.getAttribute("data-next") !== v) el.setAttribute("data-next", v);
      }
    });
    tick();
  }
  /* static structure is built once; polls only change text, so logos and timers never re-render */
  var built = false, prePaint = -1;
  function setT(id, txt, c){ var el = $(id); if (!el) return; if (el.textContent !== txt) el.textContent = txt; if (c != null && el.className !== c) el.className = c; }
  function buildHead(d){
    var card = function(l, i){
      var ls = l.sym || sym, url = AX.exUrl(l.ex, l.type, ls), fut = l.type === "fut", dash = "<span>—</span>";
      return '<div class="exc ' + (i ? "s" : "l") + '"><b><span class="ar ' + (i ? "s" : "l") + '">' + AX.icon(i ? "down" : "up") + '</span>' +
        '<a class="xl" href="' + url + '" target="_blank" rel="noopener" title="Open ' + AX.esc(ls) + " on " + AX.esc(AX.exName(l.ex)) + '">' + AX.xt(l.ex) + '<span class="n">' + AX.esc(AX.exName(l.ex)) + '</span></a>' +
        '<span class="tg' + (fut ? "" : " s") + '">' + (fut ? "FUT" : "SPOT") + '</span>' +
        '<button class="xa" type="button" data-xp="' + i + '" aria-label="Other exchanges with ' + AX.esc(ls) + '" aria-expanded="false">' + AX.icon("chevd") + "</button></b>" +
        '<div><span>Ask</span><span id="e' + i + 'a">—</span></div>' +
        '<div><span>Bid</span><span id="e' + i + 'b">—</span></div>' +
        "<div><span>Funding</span>" + (fut ? '<span><span id="e' + i + 'f">—</span> <span class="mu" id="e' + i + 'i"></span></span>' : dash) + "</div>" +
        "<div><span>Next payout</span>" + (fut ? '<span id="e' + i + 'n" data-next="">—</span>' : dash) + "</div>" +
        '<div><span>24h volume</span><span id="e' + i + 'v">—</span></div>' +
        '<div><span>Max position</span><span id="e' + i + 'm">—</span></div>' +
        '<div><span>Book spread</span><span id="e' + i + 's">—</span></div></div>';
    };
    $("exs").innerHTML = card(d.long, 0) + card(d.short, 1) + '<button class="flip" type="button" id="flip" aria-label="Flip long and short" title="Flip long ⇄ short">' + AX.icon("converter") + "</button>";
  }
  document.addEventListener("click", function(e){ if (e.target.closest("#flip")) setLegs(SH, LG); });
  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-xp]"); if (!b) return;
    var own = +b.getAttribute("data-xp");
    var me = own ? sh : lg, cur = [lg[0] + ":" + lg[1], sh[0] + ":" + sh[1]];
    AX.exPop(b, me[2], cur, function(ex, type){
      var k = ex + ":" + type + ":" + me[2];
      if (k === (own ? SH : LG)) return;
      if (k === (own ? LG : SH)){ AX.toast("Already selected on the other side", false); return; }
      setLegs(own ? LG : k, own ? k : SH);
    }, own);
  });

  /* ── order books (5 levels each side, inside the Exchanges card) ── */
  function usdk(v){ return v >= 1000 ? AX.vol(v) : "$" + v.toFixed(2); }
  function renderBook(i, l){
    var N = 6, asks = l.asks.slice(0, N), bids = l.bids.slice(0, N);
    var val = function(r){ return r[0] * r[1]; };
    var mx = Math.max.apply(null, asks.concat(bids).map(val).concat([1e-12]));
    var row = function(r, k){ return '<div class="bk-r ' + k + '"><i style="width:100%;transform:scaleX(' + Math.min(1, val(r) / mx).toFixed(3) + ')"></i><span>' + AX.plain(r[0]) + "</span><span>" + usdk(val(r)) + "</span></div>"; };
    var bid = bids[0] ? bids[0][0] : 0, ask = asks[0] ? asks[0][0] : 0, mid = (bid + ask) / 2;
    $("bk" + i).innerHTML = asks.slice().reverse().map(function(r){ return row(r, "a"); }).join("") + '<div class="bk-sep"></div>' + bids.map(function(r){ return row(r, "b"); }).join("");
    setT("bkT" + i, AX.exName(l.ex) + (l.type === "spot" ? " spot" : ""));
    setT("bkS" + i, "Spread " + (mid ? ((ask - bid) / mid * 100).toFixed(3) : "—") + "%");
  }

  /* ── calculator + simulated position (all numbers recomputed from the live books on every poll) ── */
  var unit = "usd", PK = "", pos = null, man = { l: false, s: false };
  function loadPos(){ PK = "axion-pos:" + KEY; pos = null; try { pos = JSON.parse(localStorage.getItem(PK) || "null"); } catch (e) {} }
  function savePos(){ try { if (pos) localStorage.setItem(PK, JSON.stringify(pos)); else localStorage.removeItem(PK); } catch (e) {} }
  function xlab(l, role){ return AX.xt(l.ex) + "<b>" + role + " · " + (lg[2] !== sh[2] ? AX.esc(l.sym) + " · " : "") + AX.esc(AX.exName(l.ex)) + (l.type === "spot" ? " spot" : "") + "</b>"; }
  function fp(v){ if (!(v > 0)) return ""; var s = String(+v.toPrecision(7)); if (/e/.test(s)) s = v.toFixed(10).replace(/0+$/, ""); return s; }
  function num(el){ var a = parseFloat(String(el.value).replace(",", ".")); return a > 0 ? a : 0; }
  /* prices start as the latest exchange prices (Long = best ask, Short = best bid) until the user types their own */
  function syncPx(d){
    var t = tops(d); if (!t) return;
    [["l", "cPL", t.aL], ["s", "cPS", t.bS]].forEach(function(x){
      var el = $(x[1]); if (man[x[0]] || document.activeElement === el) return;
      var v = fp(x[2]); if (el.value !== v) el.value = v;
    });
    $("cLive").hidden = !(man.l || man.s); $("cAuto").textContent = (man.l || man.s) ? "manual" : "live";
  }
  [["cPL", "l"], ["cPS", "s"]].forEach(function(x){
    $(x[0]).addEventListener("input", function(){ man[x[1]] = this.value.trim() !== ""; calc(); });
    $(x[0]).addEventListener("blur", function(){ if (this.value.trim() === "") man[x[1]] = false; calc(); });
  });
  $("cLive").addEventListener("click", function(){ man = { l: false, s: false }; calc(); });
  AX.seg($("cUnit"), function(v){ unit = v; calc(); });
  $("cAmt").addEventListener("input", calc);
  function qtyIn(pL){
    var a = num($("cAmt")); if (!(a > 0)) return 0;
    if (unit === "coin") return a;
    return pL ? a / pL : 0;
  }
  function fmtCoins(q){ return q >= 100 ? AX.num(q, 0) : q >= 1 ? q.toFixed(2) : AX.plain(q); }
  function dur(ms){ if (ms == null || ms < 0) return "—"; var m = Math.floor(ms / 60000), h = Math.floor(m / 60); return h ? h + "h " + (m % 60) + "m" : m + "m " + Math.floor(ms % 60000 / 1000) + "s"; }
  function money(v, sign){ var a = Math.abs(v), t = "$" + (a >= 100 ? AX.num(a, 2) : a.toFixed(a >= 1 ? 2 : 4)); return v < 0 ? "-" + t : (sign ? "+" : "") + t; }
  function row(k, v, c){ return "<div><span>" + AX.esc(k) + "</span><span" + (c ? ' class="' + c + '"' : "") + ">" + v + "</span></div>"; }
  function fundLine(l, role, qty){
    var nm = "Funding · " + role + " " + AX.exName(l.ex);
    if (l.type !== "fut") return { v: 0, html: row(nm, "—") };
    var v = (role === "Long" ? -1 : 1) * l.rate / 100 * qty * l.price;
    return { v: v, html: row(nm, '<span class="' + cls(v) + '">' + money(v, true) + '</span> <span class="mu">' + dur(l.next ? l.next - Date.now() : null) + "</span>") };
  }
  function sum(sp, pnl, cl){
    var s = [[ "cEntry", sp, sgn(sp, 4) ], [ "cPnl", pnl, money(pnl, true) ], [ "cExit", cl, money(cl, true) ]];
    s.forEach(function(x){ setT(x[0], x[2], "v " + cls(x[1])); });
  }
  function calc(){
    var d = D; if (!d) return;
    var t = tops(d);
    $("cBtnsA").hidden = !!pos; $("cBtnsB").hidden = !pos;
    $("cMode").textContent = pos ? "position open" : "simulation";
    if (!t) return;
    syncPx(d);
    var pL = num($("cPL")) || t.aL, pS = num($("cPS")) || t.bS;
    if (pos){
      var q = pos.qty, ls = walk(d.long.bids, q), sb = walk(d.short.asks, q), lb = walk(d.long.asks, q), ss = walk(d.short.bids, q);
      var cur = lb.avg ? (ss.avg - lb.avg) / lb.avg * 100 : 0;
      var closeFee = q * (ls.avg * d.long.fee + sb.avg * d.short.fee) / 100;
      var pnl = (pos.shortAvg - sb.avg + ls.avg - pos.longAvg) * q - pos.feeOpen - closeFee;
      var pnlConv = (pos.shortAvg - pos.longAvg) * q - pos.feeOpen - closeFee;
      var nl = pos.longAvg * q, ns = pos.shortAvg * q;
      var fl = fundLine(d.long, "Long", q), fs = fundLine(d.short, "Short", q);
      sum(cur, pnl, pnlConv);
      $("cKv").innerHTML = row("Entry prices", "$" + AX.plain(pos.longAvg) + " / $" + AX.plain(pos.shortAvg)) +
        row("Size · Long", fmtCoins(q) + " " + AX.esc(lg[2]) + " · " + money(nl)) +
        row("Size · Short", fmtCoins(q) + " " + AX.esc(sh[2]) + " · " + money(ns)) +
        row("Opened", new Date(pos.ts).toLocaleString()) +
        row("Open spread", sgn(pos.spread, 4), cls(pos.spread)) +
        row("Price gap", money((pos.shortAvg - pos.longAvg) * q, true), cls(pos.shortAvg - pos.longAvg)) +
        row("Funding", '<span class="' + cls(fl.v + fs.v) + '">' + money(fl.v + fs.v, true) + "</span>") + fl.html + fs.html +
        row("Fees", '<span class="dn">' + money(-(pos.feeOpen + closeFee)) + "</span>");
      $("cWarn").textContent = "";
      return;
    }
    /* no position: preview for the entered prices and size */
    var q0 = qtyIn(pL);
    if (!(q0 > 0) || !(pL > 0) || !(pS > 0)){ ["cEntry", "cPnl", "cExit"].forEach(function(i){ setT(i, "—", "v"); }); $("cKv").innerHTML = ""; $("cWarn").textContent = "Enter a size (USD or coins) and both prices."; calc.last = null; return; }
    var ls0 = walk(d.long.bids, q0), sb0 = walk(d.short.asks, q0), lb0 = walk(d.long.asks, q0), ss0 = walk(d.short.bids, q0);
    var got = Math.min(ls0.got, sb0.got, lb0.got, ss0.got), warn = "";
    if (got < q0 * .999) warn = "Order book is too shallow: " + fmtCoins(got) + " of " + fmtCoins(q0) + " " + lg[2] + " fits. Results use the available depth.";
    var qq = got || q0;
    var entry = (pS - pL) / pL * 100;
    var feeOpen = qq * (pL * d.long.fee + pS * d.short.fee) / 100, feeClose = qq * (ls0.avg * d.long.fee + sb0.avg * d.short.fee) / 100;
    var gap = (pS - pL) * qq, pnl0 = (pS - sb0.avg + ls0.avg - pL) * qq - feeOpen - feeClose, conv = gap - feeOpen - feeClose;
    sum(entry, pnl0, conv);
    var fl0 = fundLine(d.long, "Long", qq), fs0 = fundLine(d.short, "Short", qq);
    $("cKv").innerHTML = row("Position", fmtCoins(qq) + " " + AX.esc(lg[2]) + " · " + money(qq * pL)) +
      row("Price gap", money(gap, true), cls(gap)) +
      row("Fees open + close (est.)", '<span class="dn">' + money(-(feeOpen + feeClose)) + "</span>") + fl0.html + fs0.html;
    $("cWarn").textContent = warn;
    calc.last = { pL: pL, pS: pS, qq: qq, feeOpen: feeOpen, entry: entry };
  }
  $("cOpen").addEventListener("click", function(){
    var c = calc.last; if (!c || !c.qq) { AX.toast("Enter a size and both prices", false); return; }
    pos = { qty: c.qq, longAvg: c.pL, shortAvg: c.pS, feeOpen: c.feeOpen, spread: c.entry, ts: Date.now() };
    savePos(); AX.toast("Position opened (simulation)"); calc();
  });
  $("cAdd").addEventListener("click", function(){
    var d = D, t = d && tops(d); if (!t || !pos) return;
    var pL = num($("cPL")) || t.aL, pS = num($("cPS")) || t.bS, q = qtyIn(pL);
    if (!(q > 0)) { AX.toast("Enter the size to add", false); return; }
    var g = Math.min(walk(d.long.asks, q).got, walk(d.short.bids, q).got); if (!g) return;
    var n = pos.qty + g;
    pos.longAvg = (pos.longAvg * pos.qty + pL * g) / n; pos.shortAvg = (pos.shortAvg * pos.qty + pS * g) / n;
    pos.feeOpen += g * (pL * d.long.fee + pS * d.short.fee) / 100; pos.qty = n;
    pos.spread = (pos.shortAvg - pos.longAvg) / pos.longAvg * 100; savePos(); AX.toast("Position increased"); calc();
  });
  $("cClose").addEventListener("click", function(){
    var p = $("cPnl").textContent; pos = null; savePos(); AX.toast("Position closed · PnL " + p); calc();
  });

  /* ── countdown ── */
  function tick(){ var n = Date.now(); [].forEach.call(document.querySelectorAll("[data-next]"), function(el){ var v = +el.getAttribute("data-next"), t = v ? AX.hms(v - n) : "—"; if (el.textContent !== t) el.textContent = t; }); }
  setInterval(tick, 1000);

  /* ── polling ── */
  var url = "/api/pair?symbol=" + encodeURIComponent(sym) + "&long=" + encodeURIComponent(LG) + "&short=" + encodeURIComponent(SH);
  var busy = false, bad = 0;
  function poll(){
    if (stopped) return;
    if (document.hidden || busy){ timer = setTimeout(poll, 400); return; }
    busy = true; var t0 = performance.now(), my = url;
    fetch(my, { cache: "no-store" }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }).then(function(d){
      if (my !== url) return;
      D = d; bad = 0;
      
      AX.live($("live"), "ok", "LIVE");
      renderHead(d); renderBook(0, d.long); renderBook(1, d.short); calc();
    }).catch(function(){ bad++; AX.live($("live"), "err", bad > 2 ? "NO DATA" : "RETRY"); if (!D && !built) $("ptb").innerHTML = '<tr><td colspan="7" class="mu">Waiting for exchange data…</td></tr>'; })
    .then(function(){ busy = false; if (my !== url) return; timer = setTimeout(poll, Math.max(250, ms - (performance.now() - t0))); });
  }
  /* (re)select the two legs: everything on the page follows the chosen exchanges */
  function setLegs(L, S, first){
    LG = L; SH = S; lg = L.split(":"); sh = S.split(":"); KEY = L + "|" + S;
    var multi = lg[2] !== sh[2], pair = multi ? lg[2] + "/" + sh[2] : lg[2];
    $("pSym").textContent = pair; $("pIco").innerHTML = AX.ico(lg[2]);
    $("pSub").textContent = AX.exName(lg[0]) + (lg[1] === "spot" ? " spot" : "") + " ↔ " + AX.exName(sh[0]) + (sh[1] === "spot" ? " spot" : "");
    document.title = "AXION TERMINAL — " + pair + " " + AX.exName(lg[0]) + "/" + AX.exName(sh[0]);
    $("cLbL").innerHTML = xlab({ ex: lg[0], type: lg[1], sym: lg[2] }, "Long"); $("cLbS").innerHTML = xlab({ ex: sh[0], type: sh[1], sym: sh[2] }, "Short");
    loadPos(); man = { l: false, s: false }; $("cPL").value = ""; $("cPS").value = ""; $("cKv").innerHTML = "";
    url = "/api/pair?symbol=" + encodeURIComponent(lg[2]) + "&long=" + encodeURIComponent(L) + "&short=" + encodeURIComponent(S);
    try { history.replaceState(null, "", "?symbol=" + encodeURIComponent(lg[2]) + "&long=" + encodeURIComponent(L) + "&short=" + encodeURIComponent(S)); } catch (e) {}
    if (!first){
      D = null; built = false; prePaint = -1; hist = { e: [], x: [] }; pxMap = {};
      if (sE){ sE.setData([]); sX.setData([]); }
      $("hNote").textContent = ""; AX.live($("live"), "ok", "LOADING");
      clearTimeout(timer);
    }
    loadHist(); poll();
  }
  /* token search: pick any ticker, then choose its exchange as Long (L) or Short (S) → [token_1]/[token_2] bundle */
  if (window.initAutocomplete) window.initAutocomplete($("pq"), function(symbol, base){
    base = AX.base(base || symbol); $("pq").value = "";
    AX.exPop($("pq"), base, [lg[0] + ":" + lg[1], sh[0] + ":" + sh[1]], function(ex, type, side){
      var k = ex + ":" + type + ":" + base, L = side ? LG : k, S = side ? k : SH;
      if (L === S){ AX.toast("Both legs are identical", false); return; }
      setLegs(L, S);
    }, -1);
  });
  initChart();
  setLegs(LG, SH, true);
})();
</script>
</body></html>
