<!DOCTYPE html>
<html lang="en" data-theme="dark"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#25272D"/>
<title>AXION TERMINAL — Pair</title>
<link rel="icon" type="image/png" href="logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/><noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet"/></noscript>
<script>(function(){var t=null;try{t=localStorage.getItem('axion-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='light'?'#E9EAEC':'#25272D')})()</script>
<script>(function(){var d=document.documentElement;try{var t=+sessionStorage.getItem('axion-pt');sessionStorage.removeItem('axion-pt');if(t&&Date.now()-t<10000&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){d.classList.add('pt-in');setTimeout(function(){d.classList.remove('pt-in')},4500)}}catch(e){}})()</script>
<style>html{background:#25272D}html[data-theme=light]{background:#E9EAEC}html.pt-in{background:#0E0F11}html:not(.css) body{visibility:hidden}</style>
<link rel="stylesheet" href="axion.css?v=12" onload="document.documentElement.classList.add('css')" onerror="document.documentElement.classList.add('css')"/>
<script>setTimeout(function(){document.documentElement.classList.add("css")},3000)</script>
</head>
<body>
<div id="pt" aria-hidden="true"><div class="pt-glow"></div><div class="pt-core"><div class="pt-logo"></div><div class="pt-word">AXION <b>TERMINAL</b></div></div><div class="pt-bar"><i></i></div></div>
<div class="shell">
<main>
  <section class="card rise" style="--d:2">
    <div class="ph">
      <div class="row-f" style="gap:12px">
        <a class="icon-btn" href="spread.html" aria-label="Back" style="width:40px;height:40px;border-radius:12px" id="back"></a>
        <span class="sym"><span class="ico" id="pIco" style="width:42px;height:42px;border-radius:13px">—</span><span><b id="pSym" style="font-size:1.25rem">—</b><small id="pSub">—</small></span></span>
        <span class="sp"></span>
        <span class="live" id="live"><i></i>LOADING</span>
        <span class="cdn" id="lat" title="Round-trip latency">—</span>
      </div>
      <div class="big-sp">
        <div><div class="k">Entry spread</div><div class="v" id="vEntry">—</div></div>
        <div><div class="k">Exit spread</div><div class="v" id="vExit">—</div></div>
        <div><div class="k">Funding net / 8h</div><div class="v" id="vFund">—</div></div>
        <div><div class="k">Fees open+close</div><div class="v mu" id="vFee">—</div></div>
      </div>
      <div class="ptbl-w"><table class="ptbl"><thead><tr><th>Side</th><th>Exchange</th><th>Price</th><th>Bid / Ask</th><th>Spot</th><th>Funding</th><th>24h volume</th></tr></thead><tbody id="ptb"></tbody></table></div>
    </div>
  </section>

  <section class="pgrid rise" style="--d:3">
    <div class="card" style="min-width:0">
      <div class="ctl">
        <div class="seg" id="ivSeg" style="min-width:150px"><button data-v="1000" class="on">1s</button><button data-v="2000">2s</button><button data-v="5000">5s</button></div>
        <div class="seg" id="rgSeg" style="min-width:170px"><button data-v="60">1h</button><button data-v="360">6h</button><button data-v="1440" class="on">24h</button></div>
        <div class="legend"><span><i style="background:var(--accent-text)"></i>Entry (open)</span><span><i style="background:var(--neg)"></i>Exit (close)</span></div>
        <span class="sp"></span>
        <button class="btn sm" id="bFit" type="button">Fit</button>
        <button class="btn sm" id="bClr" type="button">Clear</button>
      </div>
      <div class="chart-w"><div id="sp-chart"></div><div class="tip" id="sp-tip"></div></div>
      <div class="mu" id="hNote" style="padding:8px 16px 12px;font:500 .6875rem var(--mono)"></div>
    </div>

    <div style="display:grid;gap:14px;align-content:start;min-width:0">
      <div class="card">
        <div class="card-h"><span class="t">Exchanges</span></div>
        <div class="two" id="exs"></div>
      </div>
      <div class="card">
        <div class="card-h"><span class="t">Spread calculator</span><span class="chip sm" id="cMode">live books</span></div>
        <div class="calc">
          <div class="row2">
            <input class="field" id="cAmt" inputmode="decimal" autocomplete="off" placeholder="Amount" value="1000" aria-label="Amount">
            <div class="seg" id="cUnit" style="min-width:130px"><button data-v="usd" class="on">USD</button><button data-v="coin">Coins</button></div>
          </div>
          <div class="kv" style="padding:0" id="cKv"></div>
          <div class="pos-sum">
            <div><div class="k" id="cK1">Open spread</div><div class="v" id="cEntry">—</div></div>
            <div><div class="k" id="cK2">PNL (close now)</div><div class="v" id="cPnl">—</div></div>
            <div><div class="k" id="cK3">Close spread</div><div class="v" id="cExit">—</div></div>
          </div>
          <div class="mu" id="cWarn" style="font:500 .75rem var(--sans);min-height:1em"></div>
          <div class="row-f" id="cBtnsA"><button class="btn primary" id="cOpen" type="button" style="flex:1">Open position</button></div>
          <div class="btns3" id="cBtnsB" hidden><a class="btn" href="spread.html" id="cBack">Back</a><button class="btn ghost-g" id="cAdd" type="button">Increase position</button><button class="btn ghost-r" id="cClose" type="button">Close position</button></div>
        </div>
      </div>
    </div>
  </section>

  <section class="books rise" style="--d:4">
    <div class="card flush"><div class="card-h"><span class="t" id="bkT0">Long book</span><span class="chip sm" id="bkS0">—</span></div><div class="bk" id="bk0"></div></div>
    <div class="card flush"><div class="card-h"><span class="t" id="bkT1">Short book</span><span class="chip sm" id="bkS1">—</span></div><div class="bk" id="bk1"></div></div>
  </section>
</main>
</div>

<script src="lwc.js?v=12"></script>
<script src="autocomplete.js?v=12"></script>
<script src="shared.js?v=12"></script>
<script>
(function(){
  AX.init("spread", { ticker: false });
  document.getElementById("back").innerHTML = AX.icon("back");
  var P = new URLSearchParams(location.search);
  var sym = AX.base(P.get("symbol") || "BTC"), LG = P.get("long") || "binance:fut", SH = P.get("short") || "okx:fut";
  var KEY = sym + "|" + LG + "|" + SH;
  var lg = LG.split(":"), sh = SH.split(":");
  document.getElementById("pSym").textContent = sym;
  document.getElementById("pIco").innerHTML = AX.ico(sym);
  document.getElementById("pSub").textContent = AX.exName(lg[0]) + (lg[1] === "spot" ? " spot" : "") + " ↔ " + AX.exName(sh[0]) + (sh[1] === "spot" ? " spot" : "");
  document.title = "AXION TERMINAL — " + sym + " " + AX.exName(lg[0]) + "/" + AX.exName(sh[0]);

  var D = null, ms = 1000, timer = 0, stopped = false;
  function $(id){ return document.getElementById(id); }
  function sgn(v, d){ return (v > 0 ? "+" : "") + v.toFixed(d == null ? 3 : d) + "%"; }
  function cls(v){ return v > 0 ? "up" : v < 0 ? "dn" : ""; }
  function usd(v){ var a = Math.abs(v); return (v < 0 ? "-$" : "$") + (a >= 100 ? AX.num(a, 0) : a >= 1 ? a.toFixed(2) : a.toFixed(4)); }
  function tops(d){
    var L = d.long, S = d.short;
    if (!L.asks.length || !L.bids.length || !S.asks.length || !S.bids.length) return null;
    return { aL: L.asks[0][0], bL: L.bids[0][0], aS: S.asks[0][0], bS: S.bids[0][0] };
  }
  /* walk the book: qty in coins → {avg, got} */
  function walk(lv, qty){
    var need = qty, cost = 0, got = 0;
    for (var i = 0; i < lv.length && need > 1e-12; i++){ var t = Math.min(need, lv[i][1]); cost += t * lv[i][0]; got += t; need -= t; }
    return { avg: got ? cost / got : 0, got: got };
  }

  /* ── chart ── */
  var chart = null, sE = null, sX = null, hist = { e: [], x: [] }, pxMap = {};
  function cc(){
    var l = AX.theme() === "light";
    return { txt: l ? "#6A6E78" : "#9A9DA6", grid: l ? "#E3E5E8" : "#2E3138", up: l ? "#00A63E" : "#00FF48", dn: l ? "#D6342C" : "#FF5A52", bg: "transparent" };
  }
  function initChart(){
    if (!window.LightweightCharts){ $("sp-chart").innerHTML = AX.empty("alert", "Chart library failed to load"); return; }
    var c = cc();
    chart = LightweightCharts.createChart($("sp-chart"), {
      autoSize: true,
      layout: { background: { type: "solid", color: c.bg }, textColor: c.txt, fontFamily: "JetBrains Mono, monospace", fontSize: 11 },
      grid: { vertLines: { color: c.grid }, horzLines: { color: c.grid } },
      rightPriceScale: { borderVisible: false, scaleMargins: { top: .12, bottom: .12 } },
      timeScale: { timeVisible: true, secondsVisible: true, borderVisible: false, rightOffset: 4 },
      crosshair: { mode: 0 },
      localization: { priceFormatter: function(v){ return v.toFixed(3) + "%"; } }
    });
    var o = { lineWidth: 2, priceLineVisible: true, lastValueVisible: true, priceFormat: { type: "custom", formatter: function(v){ return v.toFixed(3) + "%"; }, minMove: .0001 } };
    sE = chart.addLineSeries(Object.assign({ color: c.up }, o));
    sX = chart.addLineSeries(Object.assign({ color: c.dn }, o));
    chart.timeScale().fitContent();
    var tip = $("sp-tip"), wrap = $("sp-chart");
    chart.subscribeCrosshairMove(function(p){
      if (!p.time || !p.point || p.point.x < 0 || p.point.y < 0){ tip.classList.remove("on"); return; }
      var e = p.seriesData.get(sE), x = p.seriesData.get(sX);
      if (!e || !x){ tip.classList.remove("on"); return; }
      var px = pxMap[p.time] || {}, dt = new Date(p.time * 1000), z = function(n){ return (n < 10 ? "0" : "") + n; };
      var col = function(v){ return v >= 0 ? "var(--accent-text)" : "var(--neg)"; };
      tip.innerHTML = '<div class="d">' + z(dt.getDate()) + "." + z(dt.getMonth() + 1) + ", " + z(dt.getHours()) + ":" + z(dt.getMinutes()) + ":" + z(dt.getSeconds()) + "</div>" +
        '<div class="r"><i class="dt" style="background:var(--accent-text)"></i><span class="k">In %</span><span class="v" style="color:' + col(e.value) + '">' + sgn(e.value) + "</span></div>" +
        '<div class="r"><i class="dt" style="background:var(--neg)"></i><span class="k">Out %</span><span class="v" style="color:' + col(x.value) + '">' + sgn(x.value) + "</span></div>" +
        (px.l ? '<div class="r">' + AX.xt(lg[0]) + '<span class="k">' + AX.esc(AX.exName(lg[0])) + '</span><span class="v">' + AX.plain(px.l) + "</span></div>" +
        '<div class="r">' + AX.xt(sh[0]) + '<span class="k">' + AX.esc(AX.exName(sh[0])) + '</span><span class="v">' + AX.plain(px.s) + "</span></div>" : "");
      var w = tip.offsetWidth, h = tip.offsetHeight, W = wrap.clientWidth, H = wrap.clientHeight;
      var left = p.point.x + 18; if (left + w > W - 60) left = p.point.x - w - 18;
      var top = Math.min(Math.max(8, p.point.y - h / 2), H - h - 8);
      tip.style.left = Math.max(4, left) + "px"; tip.style.top = top + "px"; tip.classList.add("on");
    });
  }
  function recolor(){
    if (!chart) return; var c = cc();
    chart.applyOptions({ layout: { textColor: c.txt }, grid: { vertLines: { color: c.grid }, horzLines: { color: c.grid } } });
    sE.applyOptions({ color: c.up }); sX.applyOptions({ color: c.dn });
  }
  window.addEventListener("axion:theme", recolor);
  var lastSave = 0;
  function pushPoint(en, ex, pl, ps){
    if (!chart) return;
    var t = Math.floor(Date.now() / 1000);
    pxMap[t] = { l: pl, s: ps };
    var a = hist.e[hist.e.length - 1];
    if (a && a.time > t) return;
    if (a && a.time === t){ a.value = en; hist.x[hist.x.length - 1].value = ex; }
    else { hist.e.push({ time: t, value: en }); hist.x.push({ time: t, value: ex }); if (hist.e.length > 12000){ hist.e.shift(); hist.x.shift(); } }
    sE.update({ time: t, value: en }); sX.update({ time: t, value: ex });
  }
  AX.seg($("ivSeg"), function(v){ ms = +v; });
  /* previous 24h: 1-minute closes of both legs from the exchanges → the "tear and re-join" history */
  var rg = 1440, histOk = false;
  function applyRange(){
    if (!chart || !hist.e.length) return;
    var last = hist.e[hist.e.length - 1].time;
    try { chart.timeScale().setVisibleRange({ from: last - rg * 60, to: last + 60 }); } catch (e) {}
  }
  AX.seg($("rgSeg"), function(v){ rg = +v; applyRange(); });
  function loadHist(){
    fetch("/api/hist?symbol=" + encodeURIComponent(sym) + "&long=" + encodeURIComponent(LG) + "&short=" + encodeURIComponent(SH) + "&minutes=1440", { cache: "no-store" })
      .then(function(r){ return r.json(); }).then(function(j){
        if (!j || !j.t || !j.t.length){ $("hNote").textContent = "No history from the exchanges for this pair — chart fills live."; return; }
        var live = hist; // points collected while history was loading
        var e = [], x = [], first = live.e.length ? live.e[0].time : Infinity;
        for (var i = 0; i < j.t.length; i++){ if (j.t[i] >= first) break; pxMap[j.t[i]] = { l: j.l[i], s: j.s[i] }; e.push({ time: j.t[i], value: j["in"][i] }); x.push({ time: j.t[i], value: j.out[i] }); }
        hist = { e: e.concat(live.e), x: x.concat(live.x) };
        sE.setData(hist.e); sX.setData(hist.x); histOk = true;
        $("hNote").textContent = "History: 1-min candles · " + j.n + " points";
        applyRange();
      }).catch(function(){ $("hNote").textContent = "History unavailable — chart fills live."; });
  }
  $("bFit").addEventListener("click", function(){ if (chart) chart.timeScale().fitContent(); });
  $("bClr").addEventListener("click", function(){ hist = { e: [], x: [] }; pxMap = {}; if (sE){ sE.setData([]); sX.setData([]); } loadHist(); });

  /* ── header + table + exchange cards ── */
  function renderHead(d){
    var t = tops(d); if (!t) return;
    var en = (t.bS - t.aL) / t.aL * 100, ex = (t.bL - t.aS) / t.aS * 100;
    $("vEntry").textContent = sgn(en); $("vEntry").className = "v " + cls(en);
    $("vExit").textContent = sgn(ex); $("vExit").className = "v " + cls(ex);
    var per8 = function(l){ return l.type === "fut" ? l.rate / l.hours * 8 : 0; };
    var fn = per8(d.short) - per8(d.long);
    $("vFund").textContent = sgn(fn, 4); $("vFund").className = "v " + cls(fn);
    var fees = (d.long.fee + d.short.fee) * 2;
    $("vFee").textContent = fees.toFixed(3) + "%";
    pushPoint(en, ex, (t.aL + t.bL) / 2, (t.aS + t.bS) / 2);
    var rows = [["LONG", "l", d.long], ["SHORT", "s", d.short]].map(function(r){
      var l = r[2], bid = l.bids[0] ? l.bids[0][0] : 0, ask = l.asks[0] ? l.asks[0][0] : 0, url = AX.exUrl(l.ex, l.type, sym);
      var fund = l.type === "fut" ? '<span class="' + cls(l.rate) + '">' + sgn(l.rate, 4) + '</span> <span class="mu">' + l.hours + 'h · <span data-next="' + (l.next || "") + '">—</span></span>' : '<span class="mu">—</span>';
      var px = AX.price(l.price || (bid + ask) / 2);
      return "<tr><td><span class=\"role " + r[1] + "\">" + r[0] + "</span></td>" +
        '<td><a class="xl" href="' + url + '" target="_blank" rel="noopener" title="Open ' + AX.esc(sym) + " on " + AX.esc(AX.exName(l.ex)) + '">' + AX.xt(l.ex) + '<span class="n">' + AX.esc(AX.exName(l.ex)) + '</span><span class="tg' + (l.type === "spot" ? " s" : "") + '">' + (l.type === "spot" ? "SPOT" : "FUTURES") + "</span></a></td>" +
        '<td><a class="xl" href="' + url + '" target="_blank" rel="noopener"><span class="p">' + px + "</span></a></td>" +
        "<td>" + AX.plain(bid) + " / " + AX.plain(ask) + "</td><td>" + (l.type === "fut" && l.spot ? AX.price(l.spot) : "—") + "</td><td>" + fund + "</td><td>" + AX.vol(l.vol24h) + "</td></tr>";
    }).join("");
    $("ptb").innerHTML = rows; tick();
    $("exs").innerHTML = [d.long, d.short].map(function(l){
      var bid = l.bids[0] ? l.bids[0][0] : 0, ask = l.asks[0] ? l.asks[0][0] : 0, mid = (bid + ask) / 2;
      var bs = mid ? (ask - bid) / mid * 100 : 0, url = AX.exUrl(l.ex, l.type, sym);
      var fr = l.type === "fut" ? '<span class="' + (l.rate > 0 ? "dn" : l.rate < 0 ? "up" : "") + '">' + sgn(l.rate, 4) + "</span>" : "—";
      return '<div class="exc"><b><a class="xl" href="' + url + '" target="_blank" rel="noopener">' + AX.xt(l.ex) + '<span class="n">' + AX.esc(AX.exName(l.ex)) + "</span></a></b>" +
        "<div><span>24h volume</span><span>" + AX.vol(l.vol24h) + "</span></div>" +
        "<div><span>Funding</span><span>" + fr + "</span></div>" +
        "<div><span>Interval</span><span>" + (l.type === "fut" ? l.hours + "h" : "—") + "</span></div>" +
        "<div><span>Next payout</span><span>" + (l.type === "fut" ? '<span data-next="' + (l.next || "") + '">—</span>' : "—") + "</span></div>" +
        "<div><span>Book spread</span><span>" + bs.toFixed(3) + "%</span></div></div>";
    }).join("");
  }

  /* ── order books ── */
  function renderBook(i, l){
    var N = 10, asks = l.asks.slice(0, N), bids = l.bids.slice(0, N);
    var cum = function(a){ var c = 0; return a.map(function(r){ c += r[1]; return c; }); };
    var ca = cum(asks), cb = cum(bids), mx = Math.max(ca[ca.length - 1] || 0, cb[cb.length - 1] || 0, 1e-12);
    var row = function(r, c, k){ return '<div class="bk-r ' + k + '"><i style="width:100%;transform:scaleX(' + (c / mx).toFixed(3) + ')"></i><span>' + AX.plain(r[0]) + "</span><span>" + AX.plain(r[1]) + "</span><span>" + AX.plain(r[0] * r[1]) + "</span></div>"; };
    var bid = bids[0] ? bids[0][0] : 0, ask = asks[0] ? asks[0][0] : 0, mid = (bid + ask) / 2;
    $("bk" + i).innerHTML = '<div class="bk-h"><span>Price</span><span>Size (' + AX.esc(sym) + ")</span><span>Total ($)</span></div>" +
      asks.slice().reverse().map(function(r, k){ return row(r, ca[asks.length - 1 - k], "a"); }).join("") +
      '<div class="bk-mid"><span>' + AX.plain(mid) + '</span><span class="mu">spread ' + (mid ? ((ask - bid) / mid * 100).toFixed(3) : "—") + "%</span></div>" +
      bids.map(function(r, k){ return row(r, cb[k], "b"); }).join("");
    $("bkT" + i).innerHTML = (i === 0 ? "Long · " : "Short · ") + AX.esc(AX.exName(l.ex)) + (l.type === "spot" ? " spot" : "");
    $("bkS" + i).textContent = i === 0 ? "BUY at ask" : "SELL at bid";
  }

  /* ── calculator + simulated position (all numbers recomputed from the live books on every poll) ── */
  var unit = "usd", PK = "axion-pos:" + KEY, pos = null;
  try { pos = JSON.parse(localStorage.getItem(PK) || "null"); } catch (e) {}
  function savePos(){ try { if (pos) localStorage.setItem(PK, JSON.stringify(pos)); else localStorage.removeItem(PK); } catch (e) {} }
  AX.seg($("cUnit"), function(v){ unit = v; calc(); });
  $("cAmt").addEventListener("input", calc);
  function qtyIn(d){
    var a = parseFloat(String($("cAmt").value).replace(",", "."));
    if (!(a > 0)) return 0;
    if (unit === "coin") return a;
    var p = d.long.asks[0] ? d.long.asks[0][0] : 0; return p ? a / p : 0;
  }
  function fmtCoins(q){ return q >= 100 ? AX.num(q, 0) : q >= 1 ? q.toFixed(2) : AX.plain(q); }
  function dur(ms){ if (ms == null || ms < 0) return "—"; var m = Math.floor(ms / 60000), h = Math.floor(m / 60); return h ? h + "h " + (m % 60) + "m" : m + "m " + Math.floor(ms % 60000 / 1000) + "s"; }
  function money(v, sign){ var a = Math.abs(v), t = "$" + (a >= 100 ? AX.num(a, 2) : a.toFixed(a >= 1 ? 2 : 4)); return v < 0 ? "-" + t : (sign ? "+" : "") + t; }
  function row(k, v, c){ return "<div><span>" + AX.esc(k) + "</span><span" + (c ? ' class="' + c + '"' : "") + ">" + v + "</span></div>"; }
  function fundLine(l, role, qty){
    if (l.type !== "fut") return { v: 0, html: row("Funding · " + role + " " + AX.exName(l.ex), "—") };
    var v = (role === "Long" ? -1 : 1) * l.rate / 100 * qty * l.price;
    return { v: v, html: row("Funding · " + role + " " + AX.exName(l.ex), '<span class="' + cls(v) + '">' + money(v, true) + "</span> <span class=\"mu\">in " + dur(l.next ? l.next - Date.now() : null) + "</span>") };
  }
  function calc(){
    var d = D; if (!d) return;
    var t = tops(d);
    $("cBtnsA").hidden = !!pos; $("cBtnsB").hidden = !pos;
    $("cMode").textContent = pos ? "position open" : "live books";
    if (!t){ return; }
    if (pos){
      var q = pos.qty, ls = walk(d.long.bids, q), sb = walk(d.short.asks, q), lb = walk(d.long.asks, q), ss = walk(d.short.bids, q);
      var cur = lb.avg ? (ss.avg - lb.avg) / lb.avg * 100 : 0;
      var closeFee = q * (ls.avg * d.long.fee + sb.avg * d.short.fee) / 100;
      var pnl = (pos.shortAvg - sb.avg + ls.avg - pos.longAvg) * q - pos.feeOpen - closeFee;
      var pnlConv = (pos.shortAvg - pos.longAvg) * q - pos.feeOpen - closeFee;
      var nl = pos.longAvg * q, ns = pos.shortAvg * q;
      var fl = fundLine(d.long, "Long", q), fs = fundLine(d.short, "Short", q);
      $("cK1").textContent = "Current spread"; $("cK2").textContent = "PNL"; $("cK3").textContent = "PNL at spread close";
      $("cEntry").textContent = sgn(cur, 4); $("cEntry").className = "v " + (cur >= 0 ? "acc" : "dn");
      $("cPnl").textContent = money(pnl, true); $("cPnl").className = "v " + cls(pnl);
      $("cExit").textContent = money(pnlConv, true); $("cExit").className = "v " + cls(pnlConv);
      $("cKv").innerHTML = row("Entry prices", "$" + AX.plain(pos.longAvg) + " / $" + AX.plain(pos.shortAvg)) +
        row("Position size", fmtCoins(q * 2) + " coins / " + money(nl + ns) + ' <span class="' + cls(ns - nl) + '">(' + money(ns - nl, true) + ")</span>") +
        row("Position size · Long", fmtCoins(q) + " coins / " + money(nl)) +
        row("Position size · Short", fmtCoins(q) + " coins / " + money(ns)) +
        row("Opened", new Date(pos.ts).toLocaleString()) +
        row("Open spread", sgn(pos.spread, 4), "acc") +
        row("Price spread", money((pos.shortAvg - pos.longAvg) * q, true), cls(pos.shortAvg - pos.longAvg)) +
        row("Funding", '<span class="' + cls(fl.v + fs.v) + '">' + money(fl.v + fs.v, true) + "</span>") + fl.html + fs.html +
        row("Fees", '<span class="dn">' + money(-(pos.feeOpen + closeFee)) + "</span>");
      $("cWarn").textContent = "";
      return;
    }
    /* no position: preview for the entered size */
    var q0 = qtyIn(d), warn = "";
    $("cK1").textContent = "Open spread"; $("cK2").textContent = "PNL (close now)"; $("cK3").textContent = "Close spread";
    if (!(q0 > 0)){ ["cEntry","cPnl","cExit"].forEach(function(i){ $(i).textContent = "—"; $(i).className = "v"; }); $("cKv").innerHTML = ""; $("cWarn").textContent = "Enter a quantity (coins) or position size (USD)."; calc.last = null; return; }
    var lb0 = walk(d.long.asks, q0), ss0 = walk(d.short.bids, q0), ls0 = walk(d.long.bids, q0), sb0 = walk(d.short.asks, q0);
    var got = Math.min(lb0.got, ss0.got, ls0.got, sb0.got);
    if (got < q0 * .999) warn = "Not enough depth in the loaded order book: " + fmtCoins(got) + " of " + fmtCoins(q0) + " " + sym + " would fill. Results use the available depth.";
    var qq = got || q0;
    var entry = lb0.avg ? (ss0.avg - lb0.avg) / lb0.avg * 100 : 0, exitS = sb0.avg ? (ls0.avg - sb0.avg) / sb0.avg * 100 : 0;
    var feeOpen = qq * (lb0.avg * d.long.fee + ss0.avg * d.short.fee) / 100, feeClose = qq * (ls0.avg * d.long.fee + sb0.avg * d.short.fee) / 100;
    var gap = (ss0.avg - lb0.avg) * qq, pnl0 = (ss0.avg - lb0.avg - (sb0.avg - ls0.avg)) * qq - feeOpen - feeClose;
    $("cEntry").textContent = sgn(entry, 4); $("cEntry").className = "v " + cls(entry);
    $("cExit").textContent = sgn(exitS, 4); $("cExit").className = "v " + cls(exitS);
    $("cPnl").textContent = money(pnl0, true); $("cPnl").className = "v " + cls(pnl0);
    var fl0 = fundLine(d.long, "Long", qq), fs0 = fundLine(d.short, "Short", qq);
    $("cKv").innerHTML = row("Position", fmtCoins(qq) + " " + AX.esc(sym) + " · " + money(qq * lb0.avg)) +
      row("Avg buy · " + AX.exName(d.long.ex), "$" + AX.plain(lb0.avg)) + row("Avg sell · " + AX.exName(d.short.ex), "$" + AX.plain(ss0.avg)) +
      row("Price gap", money(gap, true), cls(gap)) + row("Fees open + close (est.)", '<span class="dn">' + money(-(feeOpen + feeClose)) + "</span>") + fl0.html + fs0.html;
    $("cWarn").textContent = warn;
    calc.last = { lb: lb0, ss: ss0, qq: qq, feeOpen: feeOpen, entry: entry, fee: feeOpen };
  }
  $("cOpen").addEventListener("click", function(){
    var c = calc.last; if (!c || !c.qq) return;
    pos = { qty: c.qq, longAvg: c.lb.avg, shortAvg: c.ss.avg, feeOpen: c.feeOpen, spread: c.entry, ts: Date.now() };
    savePos(); AX.toast("Position opened (simulation)"); calc();
  });
  $("cAdd").addEventListener("click", function(){
    var d = D; if (!d || !pos) return; var q = qtyIn(d); if (!(q > 0)) { AX.toast("Enter the size to add", false); return; }
    var lb = walk(d.long.asks, q), ss = walk(d.short.bids, q), g = Math.min(lb.got, ss.got); if (!g) return;
    var n = pos.qty + g;
    pos.longAvg = (pos.longAvg * pos.qty + lb.avg * g) / n; pos.shortAvg = (pos.shortAvg * pos.qty + ss.avg * g) / n;
    pos.feeOpen += g * (lb.avg * d.long.fee + ss.avg * d.short.fee) / 100; pos.qty = n;
    pos.spread = (pos.shortAvg - pos.longAvg) / pos.longAvg * 100; savePos(); AX.toast("Position increased"); calc();
  });
  $("cClose").addEventListener("click", function(){
    var p = $("cPnl").textContent; pos = null; savePos(); AX.toast("Position closed · PNL " + p); calc();
  });

  /* ── countdown ── */
  function tick(){ var n = Date.now(); [].forEach.call(document.querySelectorAll("[data-next]"), function(el){ var v = +el.getAttribute("data-next"); el.textContent = v ? AX.hms(v - n) : "—"; }); }
  setInterval(tick, 1000);

  /* ── polling ── */
  var url = "/api/pair?symbol=" + encodeURIComponent(sym) + "&long=" + encodeURIComponent(LG) + "&short=" + encodeURIComponent(SH);
  var busy = false, bad = 0;
  function poll(){
    if (stopped) return;
    if (document.hidden || busy){ timer = setTimeout(poll, 400); return; }
    busy = true; var t0 = performance.now();
    fetch(url, { cache: "no-store" }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }).then(function(d){
      D = d; bad = 0;
      $("lat").textContent = Math.round(performance.now() - t0) + "ms";
      AX.live($("live"), "ok", "LIVE");
      renderHead(d); renderBook(0, d.long); renderBook(1, d.short); calc();
    }).catch(function(){ bad++; AX.live($("live"), "err", bad > 2 ? "NO DATA" : "RETRY"); if (!D) $("ptb").innerHTML = '<tr><td colspan="7" class="mu">Waiting for exchange data…</td></tr>'; })
    .then(function(){ busy = false; timer = setTimeout(poll, Math.max(250, ms - (performance.now() - t0))); });
  }
  initChart();
  loadHist();
  poll();
})();
</script>
</body></html>
