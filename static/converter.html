<!DOCTYPE html>
<html lang="en" data-theme="dark"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#25272D"/>
<title>AXION TERMINAL — Converter</title>
<link rel="icon" type="image/png" href="logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/><noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet"/></noscript>
<script>(function(){var t=null;try{t=localStorage.getItem('axion-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='light'?'#E9EAEC':'#25272D')})()</script>
<script>(function(){var d=document.documentElement;try{var t=+sessionStorage.getItem('axion-pt');sessionStorage.removeItem('axion-pt');if(t&&Date.now()-t<10000&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){d.classList.add('pt-in');setTimeout(function(){d.classList.remove('pt-in')},4500)}}catch(e){}})()</script>
<style>html{background:#25272D}html[data-theme=light]{background:#E9EAEC}html.pt-in{background:#0E0F11}html:not(.css) body{visibility:hidden}</style>
<link rel="stylesheet" href="axion.css?v=6" onload="document.documentElement.classList.add('css')" onerror="document.documentElement.classList.add('css')"/>
<script>setTimeout(function(){document.documentElement.classList.add("css")},3000)</script>
</head>
<body>
<div id="pt" aria-hidden="true"><div class="pt-glow"></div><div class="pt-core"><div class="pt-logo"><img src="logo.png" alt=""></div><div class="pt-word">AXION <b>TERMINAL</b></div></div><div class="pt-bar"><i></i></div></div>
<div class="shell">
<main>
  <section class="grid rise" style="--d:2;grid-template-columns:minmax(0,1fr);align-items:start" id="lay">
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <div class="card hero">
        <div class="row-f" style="margin-bottom:14px"><span class="cap">Converter</span><span class="sp"></span><span class="live" id="live"><i></i>LOADING</span></div>
        <div class="chips" id="quick" style="margin-bottom:16px"></div>

        <div class="cap" style="margin-bottom:8px">From</div>
        <div class="cur-box">
          <button class="cur-pick" id="fromPick" aria-label="Choose currency"></button>
          <input class="cur-amt" id="fromAmt" type="number" inputmode="decimal" value="1" min="0" placeholder="0"/>
        </div>
        <div class="sub num" id="fromName" style="font-size:.75rem;margin:6px 0 0 4px">Bitcoin</div>

        <button class="swap-btn" id="swap" aria-label="Swap"></button>

        <div class="cap" style="margin:6px 0 8px">To</div>
        <div class="cur-box">
          <button class="cur-pick" id="toPick" aria-label="Choose currency"></button>
          <div class="cur-res num" id="toAmt">—</div>
        </div>
        <div class="sub num" id="toName" style="font-size:.75rem;margin:6px 0 0 4px">US Dollar</div>

        <div style="margin-top:18px">
          <div class="kv"><span>Exchange rate</span><span id="rate">—</span></div>
          <div class="kv"><span>Source</span><span class="up">Spot markets + ExchangeRate API</span></div>
          <div class="kv"><span>Updated</span><span id="upd">—</span></div>
        </div>
        <button class="btn primary" id="copy" style="width:100%;margin-top:14px"><span class="cI" style="display:grid"></span>Copy result</button>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <div class="card flush">
        <div class="card-h"><span class="t">Equivalent values</span><span class="chip sm up" id="eqT">BTC</span></div>
        <div id="multi"></div>
      </div>
      <div class="card flush">
        <div class="card-h"><span class="t">Fiat rates</span><span class="chip sm">per 1 USD</span></div>
        <div id="fiat" style="max-height:340px;overflow-y:auto;scrollbar-width:none"></div>
      </div>
    </div>
  </section>
</main>
</div>

<script src="autocomplete.js?v=6"></script>
<script src="shared.js?v=6"></script>
<script>
(function(){
  AX.init("converter");
  document.getElementById("swap").innerHTML = AX.icon("swap");
  document.querySelector("#copy .cI").innerHTML = AX.icon("copy");

  var mq = matchMedia("(min-width:900px)");
  function lay(){ document.getElementById("lay").style.gridTemplateColumns = mq.matches ? "minmax(0,1.1fr) minmax(0,.9fr)" : "minmax(0,1fr)"; }
  lay(); (mq.addEventListener ? mq.addEventListener("change", lay) : mq.addListener(lay));

  var rateMap = {}, fiatList = [], from = "BTC", to = "USD";
  var CN = {BTC:"Bitcoin",ETH:"Ethereum",SOL:"Solana",BNB:"BNB",XRP:"Ripple",DOGE:"Dogecoin",ADA:"Cardano",AVAX:"Avalanche",DOT:"Polkadot",LINK:"Chainlink",UNI:"Uniswap",ATOM:"Cosmos",LTC:"Litecoin",BCH:"Bitcoin Cash",NEAR:"NEAR Protocol",APT:"Aptos",OP:"Optimism",ARB:"Arbitrum",INJ:"Injective",SUI:"Sui",TRX:"TRON",TON:"Toncoin",SHIB:"Shiba Inu",MATIC:"Polygon",FTM:"Fantom",USDT:"Tether USD",USDC:"USD Coin"};
  var FN = {USD:"US Dollar",EUR:"Euro",UAH:"Ukrainian Hryvnia",GBP:"British Pound",JPY:"Japanese Yen",CHF:"Swiss Franc",CAD:"Canadian Dollar",AUD:"Australian Dollar",SGD:"Singapore Dollar",HKD:"Hong Kong Dollar",KRW:"South Korean Won",BRL:"Brazilian Real",MXN:"Mexican Peso",PLN:"Polish Zloty",CZK:"Czech Koruna",SEK:"Swedish Krona",NOK:"Norwegian Krone",DKK:"Danish Krone",TRY:"Turkish Lira",INR:"Indian Rupee",CNY:"Chinese Yuan"};
  var FC = Object.keys(FN);
  function isFiat(c){ return FC.indexOf(c) > -1; }
  function name(c){ return CN[c] || FN[c] || c; }
  function toUSD(c, a){ if (c === "USD") return a; if (!rateMap[c]) return 0; return isFiat(c) ? a / rateMap[c] : a * rateMap[c]; }
  function fromUSD(c, u){ if (c === "USD") return u; if (!rateMap[c]) return 0; return isFiat(c) ? u * rateMap[c] : u / rateMap[c]; }
  function fmt(n){
    if (n == null || isNaN(n)) return "—"; if (n === 0) return "0";
    var a = Math.abs(n);
    if (a < 1e-6) return n.toFixed(10); if (a < 1e-4) return n.toFixed(8); if (a < 0.01) return n.toFixed(6);
    if (a < 1) return n.toFixed(5); if (a < 100) return n.toFixed(4); if (a < 10000) return n.toFixed(2);
    return AX.num(n, 2);
  }
  var amtEl = document.getElementById("fromAmt"), toEl = document.getElementById("toAmt");

  function paintPicks(){
    document.getElementById("fromPick").innerHTML = '<span class="ico" style="width:28px;height:28px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:.625rem;color:var(--accent-text)">' + AX.esc(from.slice(0, 3)) + "</span>" + AX.esc(from) + AX.icon("chev");
    document.getElementById("toPick").innerHTML = '<span class="ico" style="width:28px;height:28px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:.625rem;color:var(--accent-text)">' + AX.esc(to.slice(0, 3)) + "</span>" + AX.esc(to) + AX.icon("chev");
    document.getElementById("fromName").textContent = name(from);
    document.getElementById("toName").textContent = name(to);
  }
  function calc(animate){
    var amt = parseFloat(amtEl.value) || 0, usd = toUSD(from, amt), res = fromUSD(to, usd);
    toEl.textContent = fmt(res);
    document.getElementById("rate").textContent = "1 " + from + " = " + fmt(fromUSD(to, toUSD(from, 1))) + " " + to;
    document.getElementById("eqT").textContent = from;
    multi(usd);
  }
  function multi(usd){
    var out = [["USD","$"],["EUR","€"],["UAH","₴"],["GBP","£"],["BTC","₿"],["ETH","Ξ"]].filter(function(o){ return o[0] !== from && o[0] !== to; });
    document.getElementById("multi").innerHTML = out.map(function(o){
      return '<div class="item" data-c="' + o[0] + '"><span class="ico">' + o[0].slice(0, 3) + '</span><span class="b"><b>' + o[0] + "</b><small>" + name(o[0]) + '</small></span><span class="v ' + (isFiat(o[0]) ? "" : "up") + '">' + o[1] + fmt(fromUSD(o[0], usd)) + "</span></div>";
    }).join("");
    [].forEach.call(document.querySelectorAll("#multi .item"), function(el){ el.addEventListener("click", function(){ quick(from, el.getAttribute("data-c")); }); });
  }
  function valid(c){ return c === "USD" || !!rateMap[c]; }
  function quick(f, t){ if (valid(f)) from = f; if (valid(t)) to = t; amtEl.value = 1; paintPicks(); calc(); }

  var swapBtn = document.getElementById("swap");
  swapBtn.addEventListener("click", function(){ var t = from; from = to; to = t; swapBtn.classList.toggle("flip"); paintPicks(); calc(); });
  amtEl.addEventListener("input", function(){ calc(); });

  var Q = [["BTC","USD"],["ETH","USD"],["BTC","ETH"],["SOL","USD"],["ETH","BTC"],["USD","UAH"],["BTC","UAH"],["USD","EUR"]];
  document.getElementById("quick").innerHTML = Q.map(function(q, i){ return '<button class="pill" data-i="' + i + '">' + q[0] + " → " + q[1] + "</button>"; }).join("");
  [].forEach.call(document.querySelectorAll("#quick .pill"), function(b){ b.addEventListener("click", function(){ var q = Q[+b.getAttribute("data-i")]; quick(q[0], q[1]); }); });

  document.getElementById("copy").addEventListener("click", function(){
    var txt = toEl.textContent + " " + to + "\n" + document.getElementById("rate").textContent;
    function ok(){ AX.toast("Copied " + toEl.textContent + " " + to); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, function(){ AX.toast("Copy blocked by browser", false); });
    else AX.toast("Copy not supported", false);
  });

  /* currency picker sheet */
  function picker(side){
    var tab = "all";
    var wrap = document.createElement("div");
    wrap.innerHTML = '<label class="search" style="width:100%;margin-bottom:10px">' + AX.icon("search") + '<input placeholder="Search currency…" autocomplete="off" spellcheck="false"/></label>' +
      '<div class="seg" style="margin-bottom:8px"><button data-v="all" class="on">All</button><button data-v="crypto">Crypto</button><button data-v="fiat">Fiat</button></div><div class="pl"></div>';
    var inp = wrap.querySelector("input"), list = wrap.querySelector(".pl");
    var sh = AX.sheet({ title: side === "from" ? "Convert from" : "Convert to", content: wrap });
    function codes(){
      var set = {};
      Object.keys(rateMap).forEach(function(k){ set[k] = 1; });
      FC.forEach(function(k){ set[k] = 1; });
      set.USD = 1; delete set.USDT;
      return Object.keys(set).sort(function(a, b){ return (isFiat(a) - isFiat(b)) || a.localeCompare(b); });
    }
    function draw(){
      var q = inp.value.trim().toUpperCase();
      var cs = codes().filter(function(c){
        return (tab === "all" || (tab === "fiat") === isFiat(c)) && (!q || c.indexOf(q) > -1 || name(c).toUpperCase().indexOf(q) > -1);
      }).slice(0, 80);
      list.innerHTML = cs.length ? cs.map(function(c){
        var sel = (side === "from" ? from : to) === c;
        return '<div class="item" data-c="' + c + '" style="margin:0 -18px;padding:10px 18px"><span class="ico">' + AX.esc(c.slice(0, 3)) + '</span><span class="b"><b>' + AX.esc(c) + "</b><small>" + AX.esc(name(c)) + "</small></span>" + (sel ? '<span class="up">' + AX.icon("check") + "</span>" : "") + "</div>";
      }).join("") : AX.empty("empty", "Nothing found");
      [].forEach.call(list.querySelectorAll(".item"), function(el){
        el.addEventListener("click", function(){
          var c = el.getAttribute("data-c");
          if (side === "from") from = c; else to = c;
          paintPicks(); calc(); sh.close();
        });
      });
    }
    AX.seg(wrap.querySelector(".seg"), function(v){ tab = v; draw(); });
    inp.addEventListener("input", draw);
    draw();
    setTimeout(function(){ if (matchMedia("(hover:hover)").matches) inp.focus(); }, 200);
  }
  document.getElementById("fromPick").addEventListener("click", function(){ picker("from"); });
  document.getElementById("toPick").addEventListener("click", function(){ picker("to"); });

  function renderFiat(){
    var entries = fiatList.length ? fiatList : FC.map(function(c){ return { code: c, name: FN[c] }; });
    document.getElementById("fiat").innerHTML = entries.map(function(f){
      var r = rateMap[f.code]; if (!r) return "";
      return '<div class="item" data-c="' + f.code + '" style="padding:10px 18px"><span class="ico" style="width:34px;height:34px;border-radius:12px">' + f.code.slice(0, 3) + '</span><span class="b"><b style="font-size:.875rem">' + f.code + "</b><small>" + AX.esc(f.name || name(f.code)) + '</small></span><span class="v mu">' + (r >= 1 ? r.toFixed(2) : r.toFixed(4)) + "</span></div>";
    }).join("");
    [].forEach.call(document.querySelectorAll("#fiat .item"), function(el){ el.addEventListener("click", function(){ to = el.getAttribute("data-c"); paintPicks(); calc(); AX.toast("Converting to " + to); }); });
  }

  function load(){
    AX.get("/api/rates").then(function(j){
      rateMap = j.rates || {}; fiatList = j.fiat_list || [];
      if (!rateMap.UAH) rateMap.UAH = 41.5; if (!rateMap.EUR) rateMap.EUR = 0.922;
      calc(); renderFiat();
      document.getElementById("upd").textContent = new Date(j.ts).toLocaleTimeString();
      AX.live(document.getElementById("live"), "ok", "LIVE RATES");
    }).catch(function(){
      if (!Object.keys(rateMap).length){ rateMap = {BTC:64230,ETH:3450,SOL:145,BNB:590,USDT:1,USD:1,EUR:0.922,UAH:41.5,GBP:0.79}; calc(); renderFiat(); }
      AX.live(document.getElementById("live"), "err", "FALLBACK");
    });
  }
  paintPicks();
  document.getElementById("multi").innerHTML = AX.skel(4, 2);
  document.getElementById("fiat").innerHTML = AX.skel(5, 2);
  load(); setInterval(load, 30000);
})();
</script>
</body></html>
