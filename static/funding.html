<!DOCTYPE html>
<html lang="en" data-theme="dark"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#25272D"/>
<title>AXION TERMINAL — Funding</title>
<link rel="icon" type="image/png" href="logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/><noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet"/></noscript>
<script>(function(){var t=null;try{t=localStorage.getItem('axion-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='light'?'#E9EAEC':'#25272D')})()</script>
<script>(function(){var d=document.documentElement;try{var t=+sessionStorage.getItem('axion-pt');sessionStorage.removeItem('axion-pt');if(t&&Date.now()-t<10000&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){d.classList.add('pt-in');setTimeout(function(){d.classList.remove('pt-in')},4500)}}catch(e){}})()</script>
<style>html{background:#25272D}html[data-theme=light]{background:#E9EAEC}html.pt-in{background:#0E0F11}html:not(.css) body{visibility:hidden}</style>
<link rel="stylesheet" href="axion.css?v=10" onload="document.documentElement.classList.add('css')" onerror="document.documentElement.classList.add('css')"/>
<script>setTimeout(function(){document.documentElement.classList.add("css")},3000)</script>
</head>
<body>
<div id="pt" aria-hidden="true"><div class="pt-glow"></div><div class="pt-core"><div class="pt-logo"></div><div class="pt-word">AXION <b>TERMINAL</b></div></div><div class="pt-bar"><i></i></div></div>
<div class="shell">
<main>
  <section class="card hero rise" style="--d:2">
    <div class="row-f" style="margin-bottom:10px"><span class="cap">Funding rates monitor</span><span class="sp"></span><span class="live" id="live"><i></i>LOADING</span></div>
    <div class="h1">Perpetual funding</div>
    <p class="sub" style="margin-top:6px" id="subline">Binance · Aster · BingX · OKX · Gate.io · MEXC perpetuals</p>
    <div style="margin-top:18px;display:flex;flex-direction:column;gap:10px">
      <div class="chips" id="exChips"></div>
      <div class="row-f">
        <div class="seg" id="dirSeg" style="min-width:250px"><button data-v="" class="on">All</button><button data-v="pos">Positive</button><button data-v="neg">Negative</button></div>
        <select class="select" id="ivSel" aria-label="Interval"><option value="">All intervals</option><option value="1H">1H</option><option value="4H">4H</option><option value="8H">8H</option></select>
        <select class="select" id="sortSel" aria-label="Sort"><option value="desc">Highest first</option><option value="asc">Lowest first</option><option value="abs">Extreme first</option></select>
      </div>
    </div>
  </section>

  <section class="grid g4 rise" style="--d:3">
    <div class="card stat"><div class="cap">Total pairs</div><div class="v" id="stT">—</div></div>
    <div class="card stat"><div class="cap">Avg rate</div><div class="v m" id="stA">—</div></div>
    <div class="card stat"><div class="cap">Positive / Negative</div><div class="v m" id="stPN">—</div></div>
    <div class="card stat"><div class="cap">Max rate</div><div class="v m" id="stM">—</div></div>
  </section>

  <section class="card flush tbl rise" style="--d:4;--cm:1.3fr 1fr 90px;--cd:1.3fr 1.1fr 1fr 1fr 70px 1fr">
    <div class="thead"><div>Pair</div><div class="dm">Exchange</div><div class="r">Rate</div><div class="r">Annual</div><div class="r dm">Interval</div><div class="r dm">Mark</div></div>
    <div id="body"></div>
    <div class="foot" id="foot" style="padding:12px 0 14px;border-top:1px solid var(--line)">—</div>
  </section>
</main>
</div>

<script src="autocomplete.js?v=10"></script>
<script src="shared.js?v=10"></script>
<script>
(function(){
  AX.init("funding");
  var all = [], ex = "", dir = "", iv = "", sort = "desc", first = true, ts = null, exBuilt = "";
  var body = document.getElementById("body"), si = document.getElementById("navSearch");
  body.innerHTML = AX.skel(8, 3);
  AX.seg(document.getElementById("dirSeg"), function(v){ dir = v; first = true; render(); });
  document.getElementById("ivSel").addEventListener("change", function(e){ iv = e.target.value; first = true; render(); });
  document.getElementById("sortSel").addEventListener("change", function(e){ sort = e.target.value; first = true; render(); });
  si.addEventListener("input", function(){ first = false; render(); });

  function chips(){
    var names = [], seen = {};
    all.forEach(function(d){ if (!seen[d.exchange]){ seen[d.exchange] = 1; names.push(d.exchange); } });
    var key = names.join("|");
    if (key === exBuilt) return;
    exBuilt = key;
    var box = document.getElementById("exChips");
    box.innerHTML = ['<button class="pill on" data-v="">All exchanges</button>'].concat(names.map(function(n){ return '<button class="pill" data-v="' + AX.esc(n) + '">' + AX.esc(n) + "</button>"; })).join("");
    [].forEach.call(box.children, function(b){
      b.addEventListener("click", function(){
        [].forEach.call(box.children, function(x){ x.classList.toggle("on", x === b); });
        ex = b.getAttribute("data-v"); first = true; render();
      });
    });
  }

  function render(){
    var q = si.value.trim().toLowerCase();
    var f = all.filter(function(d){
      return (!q || d.symbol.toLowerCase().indexOf(q) > -1) && (!ex || d.exchange === ex) && (!iv || (d.interval || "8H") === iv) && (!dir || (dir === "pos" ? d.positive : !d.positive));
    });
    f.sort(function(a, b){ return sort === "asc" ? a.rate - b.rate : sort === "abs" ? Math.abs(b.rate) - Math.abs(a.rate) : b.rate - a.rate; });
    document.getElementById("foot").textContent = f.length + " pairs shown · updated " + (ts ? ts.toLocaleTimeString() : "—");
    if (!f.length){ body.innerHTML = AX.empty("empty", "No results"); return; }
    body.innerHTML = f.slice(0, 400).map(function(d, i){
      var b = AX.base(d.symbol), inter = d.interval || "8H", c = d.positive ? "up" : "dn";
      return '<a class="trow' + (first && i < 14 ? " fresh" : "") + '" style="--d:' + i + '" href="token.html?symbol=' + encodeURIComponent(b) + '">' +
        '<div class="sym"><span class="ico">' + AX.ico(b) + '</span><span><b>' + AX.esc(b) + '</b><small class="mo"><span class="dot" style="background:' + AX.esc(d.color) + ';margin-right:5px"></span>' + AX.esc(d.exchange) + " · " + AX.esc(inter) + "</small></span></div>" +
        '<div class="dm ex"><span class="dot" style="background:' + AX.esc(d.color) + '"></span>' + AX.esc(d.exchange) + "</div>" +
        '<div class="r ' + c + '" style="font-weight:600">' + AX.pct(d.rate, 4) + "</div>" +
        '<div class="r ' + (d.annualized >= 0 ? "up" : "dn") + '" style="font-size:.8125rem">' + AX.pct(d.annualized, 1) + "</div>" +
        '<div class="r dm"><span class="chip sm ' + (inter === "1H" ? "hot" : "") + '">' + AX.esc(inter) + "</span></div>" +
        '<div class="r dm mu">' + (d.mark_price > 0 ? AX.plain(d.mark_price) : "—") + "</div></a>";
    }).join("");
    first = false;
  }

  function load(){
    AX.get("/api/funding").then(function(j){
      all = j.data || []; ts = new Date(j.ts);
      chips();
      if (all.length){
        var pos = all.filter(function(d){ return d.positive; }).length;
        var avg = all.reduce(function(s, d){ return s + d.rate; }, 0) / all.length;
        var mx = all.reduce(function(m, d){ return Math.abs(d.rate) > Math.abs(m.rate) ? d : m; }, all[0]);
        AX.count(document.getElementById("stT"), all.length, function(x){ return Math.round(x); });
        AX.count(document.getElementById("stA"), avg, function(x){ return AX.pct(x, 4); });
        document.getElementById("stPN").innerHTML = '<span class="up">' + pos + '</span> <span class="mu">/</span> <span class="dn">' + (all.length - pos) + "</span>";
        var m = document.getElementById("stM");
        m.className = "v m " + (mx.positive ? "up" : "dn");
        AX.count(m, mx.rate, function(x){ return AX.pct(x, 4); });
      }
      render();
      AX.live(document.getElementById("live"), "ok", "LIVE");
    }).catch(function(){
      AX.live(document.getElementById("live"), "err", "ERROR");
      if (!all.length) body.innerHTML = AX.empty("alert", "Backend unavailable");
    });
  }
  load(); setInterval(load, 30000);
})();
</script>
</body></html>
