<!DOCTYPE html>
<html lang="en" data-theme="dark"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#25272D"/>
<title>AXION TERMINAL — Token</title>
<link rel="icon" type="image/png" href="logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/><noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet"/></noscript>
<script>(function(){var t=null;try{t=localStorage.getItem('axion-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='light'?'#E9EAEC':'#25272D')})()</script>
<script>(function(){var d=document.documentElement;try{var t=+sessionStorage.getItem('axion-pt');sessionStorage.removeItem('axion-pt');if(t&&Date.now()-t<10000&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){d.classList.add('pt-in');setTimeout(function(){d.classList.remove('pt-in')},4500)}}catch(e){}})()</script>
<style>html{background:#25272D}html[data-theme=light]{background:#E9EAEC}html.pt-in{background:#0E0F11}html:not(.css) body{visibility:hidden}</style>
<link rel="stylesheet" href="axion.css?v=12" onload="document.documentElement.classList.add('css')" onerror="document.documentElement.classList.add('css')"/>
<script>setTimeout(function(){document.documentElement.classList.add("css")},3000)</script>
</head>
<body>
<div id="pt" aria-hidden="true"><div class="pt-glow"></div><div class="pt-core"><div class="pt-logo"></div><div class="pt-word">AXION <b>TERMINAL</b></div></div><div class="pt-bar"><i></i></div></div>
<div class="shell">
<main>
  <section class="card hero rise" style="--d:2">
    <div class="row-f" style="margin-bottom:12px">
      <a class="icon-btn" href="index.html" aria-label="Back" style="width:40px;height:40px;border-radius:14px" id="back"></a>
      <span class="sym"><span class="ico" id="tIco">—</span><span><b id="tokenSymbol" style="font-size:1.125rem">—</b><small id="tokenName">—</small></span></span>
      <span class="chip sm">SPOT</span>
      <span class="sp"></span>
      <span class="live" id="live"><i></i>LOADING</span>
    </div>
    <div class="big num" id="tokenPrice">—</div>
    <div class="row-f" style="margin-top:12px"><span class="chip" id="tokenChange">—</span><span class="sub" id="ref"></span></div>
    <div class="grid g3" style="margin-top:18px;gap:10px">
      <div style="padding:12px 14px;border-radius:18px;background:var(--surface2)"><div class="cap">24h high</div><div class="num" style="font-weight:600;margin-top:4px" id="tokenHigh">—</div></div>
      <div style="padding:12px 14px;border-radius:18px;background:var(--surface2)"><div class="cap">24h low</div><div class="num" style="font-weight:600;margin-top:4px" id="tokenLow">—</div></div>
      <div style="padding:12px 14px;border-radius:18px;background:var(--surface2)"><div class="cap">Vol 24h</div><div class="num" style="font-weight:600;margin-top:4px" id="tokenVol">—</div></div>
    </div>
  </section>

  <section class="grid rise" style="--d:3;grid-template-columns:minmax(0,1fr)" id="lay">
    <div class="card chart-card" style="display:flex;flex-direction:column;height:clamp(560px,76vh,820px)">
      <div class="tf-wrap" style="padding:14px 14px 10px">
        <div class="seg" id="tfSeg" style="min-width:340px;max-width:420px">
          <button data-v="1">1m</button><button data-v="5">5m</button><button data-v="15">15m</button><button data-v="60" class="on">1H</button><button data-v="240">4H</button><button data-v="D">1D</button><button data-v="W">1W</button>
        </div>
      </div>
      <div id="tv-chart" style="flex:1;min-height:0"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <div class="card flush tbl" style="--cm:1.2fr 1fr 1fr;--cd:1.2fr 1fr 1fr">
        <div class="card-h"><span class="t">Funding rates</span><span class="chip sm">8H · annual</span></div>
        <div class="thead"><div>Exchange</div><div class="r">Rate</div><div class="r">Annual</div></div>
        <div id="fundingBody"></div>
      </div>
      <div class="card flush">
        <div class="card-h"><span class="t">Spread opportunities</span><span class="chip sm" id="spN"></span></div>
        <div id="spreadBody"></div>
      </div>
    </div>
  </section>
</main>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script src="autocomplete.js?v=12"></script>
<script src="shared.js?v=12"></script>
<script>
(function(){
  AX.init("prices");
  var NAMES = {BTC:"Bitcoin",ETH:"Ethereum",SOL:"Solana",BNB:"BNB",XRP:"Ripple",DOGE:"Dogecoin",ADA:"Cardano",AVAX:"Avalanche",SHIB:"Shiba Inu",DOT:"Polkadot",LINK:"Chainlink",MATIC:"Polygon",UNI:"Uniswap",ATOM:"Cosmos",LTC:"Litecoin",BCH:"Bitcoin Cash",NEAR:"NEAR Protocol",APT:"Aptos",OP:"Optimism",ARB:"Arbitrum",PEPE:"Pepe",WIF:"dogwifhat",FLOKI:"Floki",TRX:"TRON",TON:"Toncoin",SUI:"Sui",FIL:"Filecoin",ICP:"Internet Computer"};
  var raw = AX.base(new URLSearchParams(location.search).get("symbol") || "BTC") || "BTC";
  var symbol = raw + "USDT", tf = "60";
  document.title = "AXION TERMINAL — " + raw;
  document.getElementById("back").innerHTML = AX.icon("back");
  document.getElementById("tIco").innerHTML = AX.ico(raw);
  document.getElementById("tokenSymbol").textContent = raw + "/USDT";
  document.getElementById("tokenName").textContent = NAMES[raw] || raw;
  document.getElementById("fundingBody").innerHTML = AX.skel(3, 3);
  document.getElementById("spreadBody").innerHTML = AX.skel(3, 3);

  var mq = matchMedia("(min-width:1000px)");
  function lay(){ document.getElementById("lay").style.gridTemplateColumns = mq.matches ? "minmax(0,1fr) 380px" : "minmax(0,1fr)"; }
  lay(); (mq.addEventListener ? mq.addEventListener("change", lay) : mq.addListener(lay));

  var tvEx = "BINANCE", TVX = { binance: "BINANCE", okx: "OKX", mexc: "MEXC", gate: "GATEIO", bingx: "BINGX" };
  function chart(){
    var el = document.getElementById("tv-chart"); el.innerHTML = "";
    if (!window.TradingView){ el.innerHTML = AX.empty("alert", "TradingView failed to load"); return; }
    var c = AX.tvColors();
    new TradingView.widget({ autosize: true, symbol: tvEx + ":" + symbol, interval: tf, timezone: "Etc/UTC", theme: c.theme, style: "1", locale: "en",
      toolbar_bg: c.bg, backgroundColor: c.bg, gridColor: c.grid, enable_publishing: false, allow_symbol_change: false, disabled_features: ["header_symbol_search","header_compare","symbol_search_hot_key","header_undo_redo"], hide_top_toolbar: true, hide_legend: false, save_image: false,
      container_id: "tv-chart", studies: ["MASimple@tv-basicstudies"],
      overrides: { "mainSeriesProperties.priceAxisProperties.percentage": false, "mainSeriesProperties.priceAxisProperties.log": false, "mainSeriesProperties.priceAxisProperties.indexedTo100": false } });
  }
  AX.seg(document.getElementById("tfSeg"), function(v){ tf = v; chart(); });
  window.addEventListener("axion:theme", chart);
  chart();

  var pFirst = true;
  function loadPrice(){
    AX.get("/api/prices?symbol=" + symbol).then(function(j){
      var data = j.data || [];
      if (!data.length){ AX.live(document.getElementById("live"), "err", "NO DATA"); return; }
      var pick = ["binance", "okx", "mexc", "gate", "bingx"].filter(function(k){ return data.some(function(d){ return String(d.exchange).toLowerCase() === k; }); })[0];
      if (pick && TVX[pick] !== tvEx){ tvEx = TVX[pick]; chart(); }
      var ref = data.filter(function(d){ return d.exchange === "binance" || d.exchange === "Binance"; })[0] || data[0];
      (pFirst ? AX.countIn : AX.count)(document.getElementById("tokenPrice"), ref.price, function(v){ return AX.price(v); });
      var c = document.getElementById("tokenChange");
      c.className = "chip " + AX.cls(ref.change24h); c.textContent = AX.pct(ref.change24h) + " · 24h";
      document.getElementById("ref").textContent = "via " + ref.exchange;
      var st = data.filter(function(d){ return d.high24h > 0 && d.low24h > 0; })[0] || ref;
      document.getElementById("tokenHigh").textContent = st.high24h > 0 ? AX.price(st.high24h) : "—";
      document.getElementById("tokenLow").textContent = st.low24h > 0 ? AX.price(st.low24h) : "—";
      document.getElementById("tokenVol").textContent = st.volume > 0 ? AX.vol(st.volume) : "—";
      AX.live(document.getElementById("live"), "ok", "LIVE"); pFirst = false;
    }).catch(function(){ AX.live(document.getElementById("live"), "err", "OFFLINE"); });
  }

  var fFirst = true;
  function loadFunding(){
    AX.get("/api/funding").then(function(j){
      var f = (j.data || []).filter(function(d){ return d.symbol === symbol; });
      document.getElementById("fundingBody").innerHTML = f.length ? f.map(function(d, i){
        var c = d.positive ? "up" : "dn";
        return '<div class="trow' + (fFirst ? " fresh" : "") + '" style="--d:' + i + ';cursor:default"><div class="ex"><span class="dot" style="background:' + AX.esc(d.color) + '"></span>' + AX.esc(d.exchange) + '</div><div class="r ' + c + '" style="font-weight:600">' + AX.pct(d.rate, 4) + '</div><div class="r ' + c + '" style="font-size:.8125rem">' + AX.pct(d.annualized, 1) + "</div></div>";
      }).join("") : AX.empty("info", "No futures data for " + raw);
      fFirst = false;
    }).catch(function(){ document.getElementById("fundingBody").innerHTML = AX.empty("alert", "Failed to load funding"); });
  }

  var sFirst = true;
  function loadSpreads(){
    AX.get("/api/spread?symbols=" + symbol).then(function(j){
      var a = j.data || [];
      document.getElementById("spN").textContent = a.length ? a.length + " found" : "";
      document.getElementById("spreadBody").innerHTML = a.length ? a.map(function(s, i){
        return '<div class="item' + (sFirst ? " fresh" : "") + '" style="--d:' + i + ';cursor:default"><span class="b"><b style="font-size:.875rem"><span class="dot" style="background:' + AX.esc(s.color_a) + '"></span>' + AX.esc(s.exchange_a) + ' → <span class="dot" style="background:' + AX.esc(s.color_b) + '"></span>' + AX.esc(s.exchange_b) + "</b><small>" + AX.plain(s.price_a) + " / " + AX.plain(s.price_b) + "</small></span>" +
          '<span class="chip ' + (s.hot ? "hot" : "up") + '">' + AX.pct(s.spread_pct, 4) + "</span></div>";
      }).join("") : AX.empty("empty", "No spread opportunities — prices are equal");
      sFirst = false;
    }).catch(function(){ document.getElementById("spreadBody").innerHTML = AX.empty("alert", "Failed to load spreads"); });
  }

  loadPrice(); loadFunding(); loadSpreads();
  setInterval(loadPrice, 10000); setInterval(loadFunding, 30000); setInterval(loadSpreads, 15000);
})();
</script>
</body></html>
