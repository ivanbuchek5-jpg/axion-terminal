<!DOCTYPE html>
<html lang="en" data-theme="dark"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0f110d"/>
<title>AXION TERMINAL — Spread</title>
<link rel="icon" type="image/png" href="logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script>(function(){var t=null;try{t=localStorage.getItem('axion-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='light'?'#f5f8ec':'#0f110d')})()</script>
<link rel="stylesheet" href="axion.css"/>
</head>
<body>
<div class="shell">
<main>
  <section class="card hero rise" style="--d:2">
    <div class="row-f" style="margin-bottom:10px"><span class="cap">Global spread scanner</span><span class="sp"></span><span class="live" id="live"><i></i>LOADING</span></div>
    <div class="h1">Cross-exchange spreads</div>
    <p class="sub" style="margin-top:6px">Binance · Bybit · MEXC · Gate.io — best price gaps, refreshed every 15s</p>
    <div class="row-f" style="margin-top:18px">
      <div class="seg" id="minSeg" style="min-width:300px;max-width:100%">
        <button data-v="0" class="on">All</button><button data-v="0.1">≥0.1%</button><button data-v="0.3">≥0.3%</button><button data-v="0.5">≥0.5%</button><button data-v="1">≥1%</button>
      </div>
      <span class="sp"></span>
      <button class="btn sm" id="refresh"><span class="rI" style="display:grid"></span><span>Refresh</span></button>
    </div>
  </section>

  <section class="grid g4 rise" style="--d:3">
    <div class="card stat"><div class="cap">Pairs scanned</div><div class="v" id="stPairs">—</div></div>
    <div class="card stat"><div class="cap">Best spread</div><div class="v m up" id="stBest">—</div></div>
    <div class="card stat"><div class="cap">Avg spread</div><div class="v m" id="stAvg">—</div></div>
    <div class="card stat"><div class="cap">Hot (≥0.5%)</div><div class="v" id="stHot">—</div></div>
  </section>

  <section class="card flush tbl rise" style="--d:4;--cm:1.2fr 1fr 84px;--cd:1.1fr 1.4fr 1.4fr 110px">
    <div class="thead"><div>Pair</div><div class="dm">Exchange A · High</div><div class="dm">Exchange B · Low</div><div class="mo r">Buy → Sell</div><div class="r">Spread</div></div>
    <div id="body"></div>
    <div class="foot" id="foot" style="padding:12px 0 14px;border-top:1px solid var(--line)">—</div>
  </section>
</main>
</div>

<script src="autocomplete.js"></script>
<script src="shared.js"></script>
<script>
(function(){
  AX.init("spread");
  document.querySelector("#refresh .rI").innerHTML = AX.icon("refresh");
  var all = [], min = 0, first = true, ts = null;
  var body = document.getElementById("body"), si = document.getElementById("navSearch");
  body.innerHTML = AX.skel(8, 3);
  AX.seg(document.getElementById("minSeg"), function(v){ min = parseFloat(v); first = true; render(); });
  si.addEventListener("input", function(){ first = false; render(); });

  function render(){
    var q = si.value.trim().toLowerCase();
    var f = all.filter(function(r){ return r.spread_pct >= min && (!q || r.symbol.toLowerCase().indexOf(q) > -1); });
    if (!f.length){ body.innerHTML = AX.empty("empty", all.length ? "No pairs match the filter" : "No spread data"); document.getElementById("foot").textContent = "0 pairs shown"; return; }
    body.innerHTML = f.map(function(s, i){
      var b = AX.base(s.symbol);
      return '<a class="trow' + (first && i < 14 ? " fresh" : "") + '" style="--d:' + i + '" href="token.html?symbol=' + encodeURIComponent(b) + '">' +
        '<div class="sym"><span class="ico">' + AX.ico(b) + '</span><span><b>' + AX.esc(b) + (s.hot ? ' <span class="chip sm hot">HOT</span>' : "") + '</b><small class="mo">' + AX.esc(s.exchange_a) + " → " + AX.esc(s.exchange_b) + "</small></span></div>" +
        '<div class="dm"><span class="ex"><span class="dot" style="background:' + AX.esc(s.color_a) + '"></span>' + AX.esc(s.exchange_a) + '</span><span class="num" style="margin-left:15px">' + AX.plain(s.price_a) + "</span></div>" +
        '<div class="dm"><span class="ex"><span class="dot" style="background:' + AX.esc(s.color_b) + '"></span>' + AX.esc(s.exchange_b) + '</span><span class="num" style="margin-left:15px">' + AX.plain(s.price_b) + "</span></div>" +
        '<div class="mo r mu" style="font-size:.75rem">' + AX.plain(s.price_a) + "<br>" + AX.plain(s.price_b) + "</div>" +
        '<div class="r"><span class="chip ' + (s.hot ? "hot" : "up") + '">' + AX.pct(s.spread_pct, 3) + "</span></div></a>";
    }).join("");
    first = false;
    document.getElementById("foot").textContent = f.length + " pairs shown · updated " + (ts ? ts.toLocaleTimeString() : "—");
  }

  function load(manual){
    var ic = document.querySelector("#refresh svg");
    ic.classList.add("spin");
    AX.get("/api/spread").then(function(j){
      all = j.data || []; ts = new Date(j.ts);
      var v = all.map(function(d){ return d.spread_pct; });
      AX.count(document.getElementById("stPairs"), all.length, function(x){ return Math.round(x); });
      if (v.length){
        AX.count(document.getElementById("stBest"), v[0], function(x){ return AX.pct(x, 4); });
        AX.count(document.getElementById("stAvg"), v.reduce(function(a, b){ return a + b; }, 0) / v.length, function(x){ return AX.pct(x, 4); });
      }
      AX.count(document.getElementById("stHot"), all.filter(function(d){ return d.spread_pct >= 0.5; }).length, function(x){ return Math.round(x); });
      render();
      AX.live(document.getElementById("live"), "ok", "LIVE");
      if (manual) AX.toast("Spreads updated");
    }).catch(function(){
      AX.live(document.getElementById("live"), "err", "ERROR");
      if (!all.length) body.innerHTML = AX.empty("alert", "Failed to connect to backend");
      if (manual) AX.toast("Update failed", false);
    }).then(function(){ ic.classList.remove("spin"); });
  }
  document.getElementById("refresh").addEventListener("click", function(){ load(true); });
  load(); setInterval(load, 15000);
})();
</script>
</body></html>
