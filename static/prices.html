<!DOCTYPE html>
<html lang="en" data-theme="dark"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#25272D"/>
<title>AXION TERMINAL — Prices</title>
<link rel="icon" type="image/png" href="logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/><noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet"/></noscript>
<script>(function(){var t=null;try{t=localStorage.getItem('axion-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='light'?'#E9EAEC':'#25272D')})()</script>
<script>(function(){var d=document.documentElement;try{var t=+sessionStorage.getItem('axion-pt');sessionStorage.removeItem('axion-pt');if(t&&Date.now()-t<10000&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){d.classList.add('pt-in');setTimeout(function(){d.classList.remove('pt-in')},4500)}}catch(e){}})()</script>
<style>html{background:#25272D}html[data-theme=light]{background:#E9EAEC}html.pt-in{background:#0E0F11}html:not(.css) body{visibility:hidden}</style>
<link rel="stylesheet" href="axion.css?v=7" onload="document.documentElement.classList.add('css')" onerror="document.documentElement.classList.add('css')"/>
<script>setTimeout(function(){document.documentElement.classList.add("css")},3000)</script>
</head>
<body>
<div id="pt" aria-hidden="true"><div class="pt-glow"></div><div class="pt-core"><div class="pt-logo"><img src="logo.png" alt=""></div><div class="pt-word">AXION <b>TERMINAL</b></div></div><div class="pt-bar"><i></i></div></div>
<div class="shell">
<main>

  <section class="card hero rise" style="--d:2">
    <div class="row-f" style="margin-bottom:12px">
      <span class="cap">Spot prices by exchange</span><span class="sp"></span>
      <span class="live" id="live"><i></i>LOADING</span>
    </div>
    <div class="grid g2" style="align-items:end;gap:20px">
      <div>
        <div class="row-f" style="gap:12px;margin-bottom:10px">
          <div style="width:170px"><input class="field" id="symbolInput" value="BTC/USDT" autocomplete="off" spellcheck="false" aria-label="Token"/></div>
          <span class="sub" id="tokenName">Bitcoin</span>
        </div>
        <div class="big num" id="headerPrice">—</div>
        <div class="row-f" style="margin-top:12px"><span class="chip" id="headerChange">—</span><span class="sub" id="refNote"></span></div>
      </div>
      <div>
        <div class="cap" style="margin-bottom:6px">Session price trace</div>
        <div id="trace"><svg class="spark" viewBox="0 0 300 84"></svg></div>
        <div class="sub num" id="traceNote" style="font-size:.75rem;margin-top:4px">collecting points every 10s…</div>
      </div>
    </div>
  </section>

  <section class="grid g3 rise" style="--d:3">
    <div class="card stat"><div class="cap">24h high</div><div class="v m" id="high24">—</div></div>
    <div class="card stat"><div class="cap">24h low</div><div class="v m" id="low24">—</div></div>
    <div class="card stat"><div class="cap">24h volume</div><div class="v m" id="vol24">—</div></div>
  </section>

  <section class="grid rise" style="--d:4;grid-template-columns:minmax(0,1fr);gap:14px" id="lay">
    <div class="card flush tbl" style="--cm:1.3fr 1fr 70px;--cd:1.3fr 1fr 1fr 1fr 90px">
      <div class="card-h"><span class="t">Exchange quotes</span><span class="chip sm" id="cnt">—</span></div>
      <div class="thead"><div>Exchange</div><div class="r">Price</div><div class="r dm">Bid</div><div class="r dm">Ask</div><div class="r">24h</div></div>
      <div id="priceBody"></div>
    </div>
    <div class="card flush">
      <div class="card-h"><span class="t">Price deviation</span><span class="chip sm up" id="maxDev">—</span></div>
      <div id="deviationBody"></div>
    </div>
  </section>
</main>
</div>

<script src="autocomplete.js?v=7"></script>
<script src="shared.js?v=7"></script>
<script>
(function(){
  AX.init("prices");
  var NAMES = {BTC:"Bitcoin",ETH:"Ethereum",SOL:"Solana",BNB:"BNB",XRP:"Ripple",DOGE:"Dogecoin",AVAX:"Avalanche",ADA:"Cardano",LINK:"Chainlink",DOT:"Polkadot",TRX:"TRON",TON:"Toncoin",SHIB:"Shiba Inu",LTC:"Litecoin"};
  var inp = document.getElementById("symbolInput");
  var qs = new URLSearchParams(location.search).get("symbol");
  if (qs) inp.value = AX.base(qs) + "/USDT";
  var hist = [], histSym = "", first = true;

  var mq = matchMedia("(min-width:900px)");
  function lay(){ document.getElementById("lay").style.gridTemplateColumns = mq.matches ? "minmax(0,1fr) 320px" : "minmax(0,1fr)"; }
  lay(); (mq.addEventListener ? mq.addEventListener("change", lay) : mq.addListener(lay));

  function sym(){ return AX.base(inp.value); }

  function load(reset){
    var b = sym(), s = b + "USDT";
    document.getElementById("tokenName").textContent = NAMES[b] || b;
    if (reset){
      first = true; hist = [];
      document.getElementById("priceBody").innerHTML = AX.skel(4, 3);
      document.getElementById("deviationBody").innerHTML = AX.skel(4, 2);
      AX.live(document.getElementById("live"), "", "LOADING");
    }
    AX.get("/api/prices?symbol=" + encodeURIComponent(s)).then(function(j){
      var data = j.data || [];
      if (b !== sym()) return;
      if (!data.length){
        document.getElementById("priceBody").innerHTML = AX.empty("empty", "No quotes for " + b);
        document.getElementById("deviationBody").innerHTML = "";
        AX.live(document.getElementById("live"), "err", "NO DATA"); return;
      }
      var ref = data[0];
      var hp = document.getElementById("headerPrice");
      if (hp._sym !== b){ hp._v = null; hp._sym = b; }
      (first ? AX.countIn : AX.count)(hp, ref.price, function(v){ return AX.price(v); });
      var c = document.getElementById("headerChange");
      c.className = "chip " + AX.cls(ref.change24h);
      c.textContent = AX.pct(ref.change24h) + " · 24h";
      document.getElementById("refNote").textContent = "via " + ref.exchange;
      var st = data.filter(function(d){ return d.high24h > 0 && d.low24h > 0; })[0] || ref;
      document.getElementById("high24").textContent = st.high24h > 0 ? AX.price(st.high24h) : "—";
      document.getElementById("low24").textContent = st.low24h > 0 ? AX.price(st.low24h) : "—";
      document.getElementById("vol24").textContent = AX.vol(st.volume);
      document.getElementById("cnt").textContent = data.length + " venues";

      document.getElementById("priceBody").innerHTML = data.map(function(e, i){
        return '<div class="trow' + (first ? " fresh" : "") + '" style="--d:' + i + '" onclick="AX.go(\'' + b + '\')">' +
          '<div class="ex"><span class="dot" style="background:' + AX.esc(e.color) + '"></span>' + AX.esc(e.exchange) + "</div>" +
          '<div class="r">' + AX.price(e.price) + "</div>" +
          '<div class="r dm mu">' + (e.bid > 0 ? AX.price(e.bid) : "—") + "</div>" +
          '<div class="r dm mu">' + (e.ask > 0 ? AX.price(e.ask) : "—") + "</div>" +
          '<div class="r ' + AX.cls(e.change24h) + '">' + AX.pct(e.change24h) + "</div></div>";
      }).join("");

      var prices = data.map(function(d){ return d.price; });
      var mx = Math.max.apply(0, prices), mn = Math.min.apply(0, prices);
      var md = document.getElementById("maxDev");
      md.textContent = "max " + AX.pct((mx - mn) / mn * 100, 4);
      document.getElementById("deviationBody").innerHTML = data.map(function(e){
        var w = mx > mn ? (e.price - mn) / (mx - mn) : 0;
        return '<div class="item" style="cursor:default;flex-direction:column;align-items:stretch;gap:8px">' +
          '<div class="row-f" style="gap:8px"><span class="ex"><span class="dot" style="background:' + AX.esc(e.color) + '"></span>' + AX.esc(e.exchange) + '</span><span class="sp"></span><span class="num" style="font-size:.8125rem;font-weight:600">' + AX.price(e.price) + "</span></div>" +
          '<div class="bar"><i style="--w:' + (first ? 0 : w) + '" data-w="' + w + '"></i></div></div>';
      }).join("");
      if (first) requestAnimationFrame(function(){ requestAnimationFrame(function(){
        [].forEach.call(document.querySelectorAll("#deviationBody .bar i"), function(i){ i.style.setProperty("--w", i.getAttribute("data-w")); });
      }); });

      /* session trace */
      if (histSym !== b){ hist = []; histSym = b; }
      hist.push(ref.price); if (hist.length > 60) hist.shift();
      var tr = document.getElementById("trace");
      if (hist.length >= 2){
        tr.innerHTML = AX.spark(hist, hist[hist.length - 1] >= hist[0]);
        document.getElementById("traceNote").textContent = hist.length + " points · " + AX.pct((hist[hist.length - 1] - hist[0]) / hist[0] * 100, 3) + " since open";
      }
      AX.live(document.getElementById("live"), "ok", "LIVE");
      first = false;
    }).catch(function(){
      if (first){ document.getElementById("priceBody").innerHTML = AX.empty("alert", "Failed to load quotes"); }
      AX.live(document.getElementById("live"), "err", "ERROR");
    });
  }

  initAutocomplete(inp, function(s, base){ inp.value = base + "/USDT"; histSym = ""; load(true); });
  inp.addEventListener("focus", function(){ inp.select(); });
  load(true);
  setInterval(function(){ load(false); }, 10000);
})();
</script>
</body></html>
